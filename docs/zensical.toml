[project]
site_name = "MarketForge"
site_description = "Historical market-data acquisition, normalization and dataset inspection"
docs_dir = "content"
site_dir = "site"
extra_css = ["assets/stylesheets/extra.css"]
nav = [
  { "Start here" = [
    { "MarketForge" = "index.md" },
    { "Orientation" = "getting-started/index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Bybit Quick Start" = "getting-started/quickstart.md" },
  ] },
  { "Guides" = [
    { "Overview" = "workflows/index.md" },
    { "Describe instruments" = ["workflows/catalogue/index.md", "workflows/catalogue/exchanges-and-instruments.md", "workflows/catalogue/specifications.md"] },
    { "Acquire and register" = ["workflows/acquisition/index.md", "workflows/acquisition/historical-data.md", "workflows/acquisition/external-data.md", "workflows/acquisition/managing-acquisitions.md", "workflows/acquisition/forge.md"] },
    { "Create profiles" = ["workflows/catalogue/profiles.md", "workflows/catalogue/profile-trades.md", "workflows/catalogue/profile-depth.md", "workflows/catalogue/profile-troubleshooting.md"] },
    { "Process data" = ["workflows/pipeline.md", "workflows/normalize.md", "workflows/merge.md", "workflows/conversion.md"] },
    { "Use datasets" = ["workflows/datasets.md", "workflows/notebooks.md"] },
    { "Explore markets" = ["workflows/markets/index.md", "workflows/markets/instrument-discovery.md", "workflows/markets/market-statistics.md", "workflows/markets/rankings.md"] },
    { "Operate MarketForge" = "workflows/operations.md" },
  ] },
  { "Concepts" = "concepts/index.md" },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "CLI" = ["reference/cli/acquisition.md", "reference/cli/catalog.md", "reference/cli/maintenance.md", "reference/cli/engine.md", "reference/cli/registration.md", "reference/cli/normalize.md", "reference/cli/merge.md", "reference/cli/convert.md", "reference/cli/datasets.md", "reference/cli/markets.md"] },
    { "Configuration and recipes" = ["configuration/index.md", "configuration/acquisition.md", "configuration/normalization.md", "configuration/conversion.md", "configuration/markets.md"] },
    { "Profiles" = "reference/profiles.md" },
    { "Registration declarations" = "reference/registration.md" },
    { "Runtime and policies" = "reference/runtime.md" },
    { "Prepared contracts" = "reference/prepared.md" },
    { "Publication formats" = "reference/publications.md" },
    { "Python datasets" = "reference/python-datasets.md" },
  ] },
  { "Examples" = ["examples/index.md", "examples/catalogue/index.md", "examples/catalogue/merge.md", "examples/bring-your-own-data/index.md", "examples/bring-your-own-data/databento/index.md"] },
  { "Development" = [
    "development/index.md",
    "development/setup.md",
    "development/first-contribution.md",
    "development/architecture.md",
    "development/operations.md",
    { "Extension guides" = [
      "development/extending.md",
      "development/sources.md",
      "development/orchestration.md",
    ] },
    "development/testing.md",
    "development/debugging.md",
    "development/performance.md",
    "development/compatibility.md",
  ] },
]

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.theme]
logo = "assets/branding/logo_small.png"
favicon = "assets/branding/logo_small.png"
font = false
features = ["navigation.tabs", "navigation.sections", "navigation.indexes", "content.code.copy"]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }
