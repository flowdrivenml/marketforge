[project]
site_name = "MarketForge"
site_description = "Historical market-data pipelines and quantitative research"
site_url = "https://flowdrivenml.github.io/marketforge/"
repo_url = "https://github.com/flowdrivenml/marketforge"
docs_dir = "content"
site_dir = "site"
extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = ["assets/javascripts/keyboard.js"]
nav = [
  { "Using MarketForge" = [
    { "Introduction" = "index.md" },
    { "Getting Started" = [
      "getting-started/index.md",
      { "Installation" = "getting-started/installation.md" },
      { "Quick Start" = "getting-started/quickstart.md" },
      { "Interactive Workspace" = "workflows/forge-tui.md" },
    ] },
    { "Workflows" = [
      "workflows/index.md",
      { "Acquisition" = [
        "workflows/acquisition/index.md",
        "workflows/acquisition/historical-data.md",
        "workflows/acquisition/external-data.md",
        "workflows/acquisition/forge.md",
        "workflows/acquisition/managing-acquisitions.md",
      ] },
      { "Live" = ["workflows/live/index.md", "workflows/live/management.md", "workflows/live/consumption.md"] },
      { "Storage" = "workflows/storage.md" },
      { "Catalogue" = ["workflows/catalogue/index.md", "workflows/catalogue/exchanges-and-instruments.md", "workflows/catalogue/specifications.md"] },
      { "Markets and rankings" = ["workflows/markets/index.md", "workflows/markets/instrument-discovery.md", "workflows/markets/market-statistics.md", "workflows/markets/rankings.md"] },
      { "Normalization" = [
        "workflows/normalization/index.md",
        "workflows/normalization/author-profile.md",
        "workflows/normalization/profile-troubleshooting.md",
      ] },
      { "Merge" = "workflows/merge.md" },
      { "Conversion" = "workflows/conversion.md" },
      { "Historical pipeline" = "workflows/pipeline.md" },
      { "Inspection" = ["workflows/inspection/datasets.md", "workflows/inspection/runs.md"] },
    ] },
    { "Concepts" = ["concepts/index.md", "concepts/data-model.md", "concepts/identity.md", "concepts/configuration.md", "concepts/time.md", "concepts/depth.md", "concepts/ordering.md", "concepts/normalization.md", "concepts/merge.md", "concepts/conversion.md", "concepts/evidence.md", "concepts/execution.md", "concepts/glossary.md"] },
    { "Reference" = [
      "reference/index.md",
      { "CLI" = ["reference/cli/index.md", "reference/cli/sorting.md", "reference/cli/forge.md", "reference/cli/acquisition.md", "reference/cli/storage.md", "reference/cli/runs.md", "reference/cli/catalog.md", "reference/cli/maintenance.md", "reference/cli/engine.md", "reference/cli/registration.md", "reference/cli/normalize.md", "reference/cli/merge.md", "reference/cli/convert.md", "reference/cli/pipeline.md", "reference/cli/datasets.md", "reference/cli/markets.md"] },
      { "Configuration and recipes" = ["reference/configuration/index.md", "reference/configuration/application.md", "reference/configuration/explorer.md", "reference/runtime.md", "reference/configuration/pipeline-runtime.md", "reference/configuration/acquisition.md", "reference/configuration/catalogue.md", "reference/configuration/normalization.md", "reference/configuration/normalization-runtime.md", "reference/configuration/merge.md", "reference/configuration/merge-runtime.md", "reference/configuration/conversion.md", "reference/configuration/conversion-runtime.md", "reference/configuration/profile-fields.md", "reference/configuration/pipeline.md", "reference/configuration/markets.md"] },
      { "Live" = ["reference/live/configuration.md", "reference/live/management-api.md", "reference/live/streaming-protocol.md"] },
      "reference/acquisition-sources.md",
      "reference/registration.md",
      { "Data formats" = [
        "reference/data-formats/publications.md",
        "reference/data-formats/publication-normalized.md",
        "reference/data-formats/publication-merge.md",
        "reference/data-formats/publication-converted.md",
        { "Prepared jobs and evidence" = ["reference/data-formats/prepared.md", "reference/data-formats/prepared-normalization.md", "reference/data-formats/prepared-merge.md", "reference/data-formats/prepared-conversion.md", "reference/data-formats/prepared-forge.md"] },
      ] },
    ] },
    { "Examples" = ["examples/index.md", "examples/bybit/manual-normalization.md", "examples/catalogue/index.md", "examples/catalogue/merge.md", "examples/bring-your-own-data/index.md", "examples/bring-your-own-data/databento/index.md"] },
    { "Maintenance" = ["maintenance/index.md", "maintenance/database.md", "maintenance/publications.md", "maintenance/conversion.md"] },
  ] },
  { "Research & Analysis" = [
    "research/index.md",
    "research/notebooks.md",
    "research/discovery.md",
    "research/partitions.md",
    "research/querying.md",
    "research/python-api.md",
  ] },
  { "Development" = [
    { "Developer overview" = "development/index.md" },
    { "Getting started" = ["development/setup.md", "development/first-contribution.md"] },
    { "Architecture" = [
      { "System overview" = "development/architecture.md" },
      "development/forge.md",
      { "Historical Engine" = ["development/normalize.md", "development/merge.md", "development/convert.md"] },
      { "Live Engine" = ["development/live/architecture.md", "development/live/lifecycle.md", "development/live/processing.md"] },
      "development/operations.md",
      "development/forge-tui.md",
    ] },
    { "Extending MarketForge" = ["development/extending.md", "development/sources.md", "development/orchestration.md"] },
    { "Testing" = "development/testing.md" },
    { "Debugging and performance" = ["development/debugging.md", "development/performance.md"] },
    { "Contributing" = "development/compatibility.md" },
  ] },
]

[project.plugins.redirects.redirect_maps]
"configuration/acquisition.md" = "reference/configuration/acquisition.md"
"configuration/application.md" = "reference/configuration/application.md"
"configuration/catalogue.md" = "reference/configuration/catalogue.md"
"configuration/conversion.md" = "reference/configuration/conversion.md"
"configuration/index.md" = "reference/configuration/index.md"
"configuration/markets.md" = "reference/configuration/markets.md"
"configuration/merge-runtime.md" = "reference/configuration/merge-runtime.md"
"configuration/merge.md" = "reference/configuration/merge.md"
"configuration/normalization-runtime.md" = "reference/configuration/normalization-runtime.md"
"configuration/normalization.md" = "reference/configuration/normalization.md"
"configuration/pipeline.md" = "reference/configuration/pipeline.md"
"reference/history-maintenance.md" = "maintenance/publications.md"
"reference/prepared-conversion.md" = "reference/data-formats/prepared-conversion.md"
"reference/prepared-forge.md" = "reference/data-formats/prepared-forge.md"
"reference/prepared-merge.md" = "reference/data-formats/prepared-merge.md"
"reference/prepared-normalization.md" = "reference/data-formats/prepared-normalization.md"
"reference/prepared.md" = "reference/data-formats/prepared.md"
"reference/profile-fields.md" = "reference/configuration/profile-fields.md"
"reference/profiles.md" = "workflows/normalization/author-profile.md"
"reference/publication-converted.md" = "reference/data-formats/publication-converted.md"
"reference/publication-merge.md" = "reference/data-formats/publication-merge.md"
"reference/publication-normalized.md" = "reference/data-formats/publication-normalized.md"
"reference/publications.md" = "reference/data-formats/publications.md"
"workflows/catalogue/profile-depth.md" = "workflows/normalization/author-profile.md"
"workflows/catalogue/profile-trades.md" = "workflows/normalization/author-profile.md"
"workflows/catalogue/profile-troubleshooting.md" = "workflows/normalization/profile-troubleshooting.md"
"workflows/catalogue/profiles.md" = "workflows/normalization/author-profile.md"
"workflows/datasets.md" = "workflows/inspection/datasets.md"
"workflows/normalize.md" = "workflows/normalization/index.md"
"workflows/notebooks.md" = "research/notebooks.md"
"workflows/inspection/notebooks.md" = "research/notebooks.md"
"reference/python-datasets.md" = "research/python-api.md"
"workflows/runs.md" = "workflows/inspection/runs.md"

[project.markdown_extensions]
footnotes = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["content"]
check_paths = true

[project.theme]
logo = "assets/branding/logo_small.png"
favicon = "assets/branding/logo_small.png"
font = false
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.footer",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }
