# Synthetic format with an explicit aggressor side.
schema_version = 2
kind = "profile"
id = "example_exchange.equity.equity.trades"
format_code = "EXAMPLE-EXCHANGE-T1"
exchange = "example_exchange"
instrument_type = "equity"
market_category = "equity"

[source]
container = "plain"
format = "csv"
record_format = "rows"
header = false
ordering = "chronological"
granularity = "daily"

[fields.timestamp]
type = "integer"
position = 1
encoding = "unix_nanoseconds"

[fields.price]
type = "decimal"
position = 2

[fields.size]
type = "decimal"
position = 3

[fields.side]
type = "string"
position = 4

[normalization]
target = "trade"
quantity_encoding = "base"

[normalization.event_timestamp]
field = "timestamp"

[normalization.price]
field = "price"

[normalization.quantity]
field = "size"

[normalization.side]
transform = "map"
field = "side"

[normalization.side.values]
b = "buy"
s = "sell"
