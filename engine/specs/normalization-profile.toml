# Descriptions and cross-field rules for Rust schema-2 profile authoring.
# Field types, enum variants and serde optionality are derived where typed.
mapping_types = ["trade.FieldSpec", "trade.SideSpec", "trade.QuantitySpec", "trade.BoolSpec", "depth.FieldSpec", "depth.InstrumentFieldSpec", "depth.EventFilter", "depth.LevelArraySpec", "depth.QuantityFieldSpec", "depth.SideSpec"]
limitations = [
  "An omitted optional TOML key has no value unless a default is shown. TOML has no null literal.",
  "A required rule mapping can be supplied by the common normalization table or by a rule item. An item cannot override a common key.",
  "The catalogue validates namespace, target, field references and cross-field semantics. Runtime readers enforce data-dependent constraints.",
  "The authoring reference does not guarantee compilation or input compatibility. Use Rust profile validation and a representative sample.",
]

[sections]
identity = "Schema discriminator, installed identity and inventory-only marker. Match the venue, instrument and market to the catalogue."
source = "Archive wrapper, record representation and source layout."
fields = 'Replace <name> with a real source column or JSON path. Use [fields."data.ts"] for a dotted raw key. Omit optional TOML keys to leave them unset unless a default is documented.'
normalization = "Map raw fields to canonical operations. Use [[normalization.rules]] for multiple targets. Each item inherits common mappings and cannot override a common key."
feeds = "Gate.io depth can declare snapshot and incremental feed variants. Replace <feed> with one of those keys. Each feed supplies its own source, fields and normalization."

[annotations."wire.Unified"]
schema_version = {description = "Authoring schema discriminator.", values = [2], meanings."2" = "Current self-contained TOML profile.", examples = ["schema_version = 2"]}
kind = {description = "Document kind.", values = ["profile"], meanings.profile = "Standalone normalization profile.", examples = ['kind = "profile"']}
id = {description = "Exact installed namespace and filename stem.", type = "identifier", constraints = ["exchange.instrument_type.market_category.trades|depth", "Must agree with the three identity keys and installed trades/ or depth/ directory."], related = ["exchange", "instrument_type", "market_category"], examples = ['id = "bybit.perpetual.linear.trades"']}
format_code = {description = "Venue and content format identity used by catalogue resolution.", type = "identifier", constraints = ["Venue uppercase with hyphens in place of underscores. Gate.io uses GATE.", "Suffix T or B plus a positive decimal integer without leading zero. Must be unambiguous in its venue and market namespace."], examples = ['format_code = "BYBIT-T2"']}
exchange = {description = "Execution venue code, including manual venues.", type = "identifier", constraints = ["One to 32 lowercase ASCII letters, digits or underscores, starting with a letter. The reserved code external is rejected."], examples = ['exchange = "bybit"']}
instrument_type = {description = "Instrument kind matched by the catalogue and task.", enum = "instrument.InstrumentKind", meanings = {spot = "Spot instrument.", perpetual = "Perpetual contract.", future = "Dated future.", option = "Option contract.", equity = "Cash equity."}, examples = ['instrument_type = "perpetual"']}
market_category = {description = "Market namespace used for matching.", enum = "catalogue.MarketCategory", meanings = {spot = "Spot instruments.", linear = "Linear perpetuals or futures.", inverse = "Inverse perpetuals or futures.", option = "Options.", equity = "Cash equities."}, related = ["instrument_type"], examples = ['market_category = "linear"']}
source = {description = "Physical input metadata.", children = "wire.Source", examples = ["[source]"]}
fields = {description = "Nonempty map of source names to raw field declarations.", children = "RawFieldMap", examples = ["[fields.timestamp]"]}
normalization = {description = "Common mappings and operation selection.", type = "table", children = "normalization", examples = ["[normalization]"]}
unsupported_reason = {description = "Mark this definition inventory-only with a nonblank reason. Rust checks structure and references but does not enable its processing rules.", examples = ['unsupported_reason = "Reader not implemented"']}
feeds = {description = "Optional Gate.io depth feed map.", children = "FeedMap", examples = ["[feeds.snapshot.source]"]}

[annotations."wire.Source"]
container = {description = "Outer wrapper, independent of the inner record representation.", enum = "container.SourceContainer", meanings = {plain = "Uncompressed input.", gzip = "Gzip stream.", zip = "ZIP archive member.", tar_gzip = "Gzip-compressed tar member."}, examples = ['container = "zip"']}
format = {description = "Physical format decoded after opening the wrapper.", enum = "catalogue.PhysicalRecord", meanings = {csv = "Comma-separated records.", jsonl = "One JSON value per line.", xlsx = "Excel workbook with the fixed depth layout."}, examples = ['format = "jsonl"']}
record_format = {description = "Logical grouping of records, independent of the physical format.", enum = "catalogue.RecordFormat", meanings = {rows = "Trade rows.", events = "Depth events.", snapshot_rows = "Snapshot rows.", book_rows = "Book rows."}, examples = ['record_format = "events"']}
header = {description = "Whether input has a header row.", required = "conditional", dependencies = ["Required for CSV and XLSX. Must be true for XLSX. Forbidden in JSONL trade profiles."], formats = ["csv", "jsonl", "xlsx"], examples = ["header = true"]}
ordering = {description = "Declared source ordering.", values = ["chronological", "timestamp_sortable", "not_chronological"], meanings = {chronological = "Source-ordered input.", timestamp_sortable = "Input that can be sorted by timestamp.", not_chronological = "Alias for timestamp_sortable."}, examples = ['ordering = "chronological"']}
granularity = {description = "Descriptive archive packaging interval, independent of event frequency.", values = ["daily", "hourly", "monthly"], meanings = {daily = "Daily package.", hourly = "Hourly package.", monthly = "Monthly package."}, examples = ['granularity = "daily"']}
archive_day_boundary = {description = "Descriptive calendar boundary for source packaging, independent of event time.", values = ["UTC", "UTC+8"], meanings = {utc = "UTC boundary.", "utc+8" = "UTC plus eight hours."}, examples = ['archive_day_boundary = "UTC+8"']}
daily_packaging = {description = "Descriptive daily package shape.", values = ["numbered_zip_chunks"], meanings.numbered_zip_chunks = "Numbered ZIP chunks.", examples = ['daily_packaging = "numbered_zip_chunks"']}
maximum_depth_per_side = {description = "Declared maximum levels per side.", constraints = ["Positive unsigned 64-bit integer."], dependencies = ["A bounded_observation must declare the same value in snapshot.levels_per_side."], examples = ["maximum_depth_per_side = 10"]}
workbook_sheets = {description = "Number of worksheets supported by the fixed workbook layout.", required = "conditional", values = [1], meanings."1" = "Exactly one worksheet.", formats = ["xlsx"], dependencies = ["Required for XLSX and forbidden otherwise. XLSX requires header=true, timestamp-sortable input, exactly timestamp/asks/bids, Unix seconds, and ascending timestamp sort."], examples = ["workbook_sheets = 1"]}
trade_id_scope = {description = "Native trade identifier uniqueness policy.", enum = "identity.TradeIdScope", meanings = {global = "Globally unique native ID.", instrument_scoped = "Unique within an instrument and declared reset domain.", ordered_run = "Decimal IDs in one checked, non-reset ordered stream run.", source_local = "Unique only within a source.", unreliable = "ID has no reliable deduplication contract."}, dependencies = ["Trade-only. Requires a native normalization.trade_id.field mapping."], related = ["source.trade_id_reset_domain", "normalization.trade_id.field"], examples = ['trade_id_scope = "source_local"']}
trade_id_reset_domain = {description = "Nonblank native identifier reset domain.", required = "conditional", dependencies = ["Required for instrument_scoped and ordered_run. Forbidden for other scopes or when scope is omitted."], examples = ['trade_id_reset_domain = "session"']}

[annotations.FeedMap]
"<feed>" = {description = "Complete feed override with its own source, fields and normalization.", type = "table", required = "optional", constraints = ["Only snapshot and incremental feed keys are supported."], dependencies = ["Only Gate.io depth."], children = "wire.FeedDefinition", examples = ["[feeds.snapshot.source]"]}
[annotations."wire.FeedDefinition"]
source = {description = "Complete physical metadata for this variant.", children = "wire.Source", examples = ["[feeds.snapshot.source]"]}
fields = {description = "Complete raw field definitions for this variant.", children = "RawFieldMap", examples = ["[feeds.snapshot.fields.timestamp]"]}
normalization = {description = "Complete depth operations for this variant.", type = "table", children = "normalization", examples = ["[feeds.snapshot.normalization]"]}

[annotations.RawFieldMap]
"<name>" = {description = "One literal source column or JSON path. Quote a dotted key in TOML.", type = "table", required = "conditional", constraints = ["At least one field is required."], children = "RawField", examples = ['[fields."data.ts"]']}
[annotations.RawField]
type = {description = "Declared source field representation.", type = "string", values = ["decimal", "integer", "string", "array", "boolean", "integer/string", "uuid/string", "integer/bool", "string/integer", "signed_integer", "signed_decimal"], meanings = {decimal = "Decimal value.", integer = "Integer value.", string = "Text value.", array = "Array.", boolean = "Boolean value.", "integer/string" = "Integer or text.", "uuid/string" = "UUID or text.", "integer/bool" = "Integer or boolean.", "string/integer" = "Text or integer.", signed_integer = "Signed integer.", signed_decimal = "Signed decimal."}, examples = ['type = "decimal"']}
encoding = {description = "Timestamp encoding for a mapped source field.", type = "string", required = "conditional", values = ["unix_seconds", "unix_milliseconds", "unix_microseconds", "unix_nanoseconds", "iso8601_nanoseconds"], meanings = {unix_seconds = "Unix epoch seconds.", unix_milliseconds = "Unix epoch milliseconds.", unix_microseconds = "Unix epoch microseconds.", unix_nanoseconds = "Unix epoch nanoseconds.", iso8601_nanoseconds = "ISO 8601 text with nanosecond precision."}, dependencies = ["Required for each effective event_timestamp field. If either timestamp uses ISO 8601, both mapped timestamps must declare ISO 8601 and type string."], related = ["normalization.event_timestamp.field", "normalization.system_timestamp.field"], examples = ['encoding = "unix_milliseconds"']}
position = {description = "One-based source column position.", type = "integer", required = "optional", constraints = ["If used, all positions must be contiguous from one and distinct. Not supported for JSONL trades."], formats = ["csv", "xlsx"], examples = ["position = 1"]}
precision = {description = "Descriptive precision evidence. Does not select a timestamp decoder.", type = "TOML value", required = "optional", examples = ['precision = "millisecond"']}
fractional_digits = {description = "Descriptive fractional-digit evidence. The compiler does not enforce a digit cap from this key.", required = "optional", examples = ["fractional_digits = 6"]}
observed_effective_precision = {description = "Descriptive observation of effective precision.", required = "optional", examples = ['observed_effective_precision = "second"']}
values = {description = "Descriptive observed raw values. A separate mapping defines canonical output.", required = "optional", examples = ['values = ["snapshot", "delta"]']}
level_format = {description = "Positional depth level layout. Array order defines zero-based indices.", type = "array of string", required = "optional", constraints = ['Exactly ["price", "quantity"] or ["price", "quantity", "order_count"].'], related = ["fields.<name>.level_fields"], examples = ['level_format = ["price", "quantity"]']}
ordering = {description = "Descriptive source field ordering. Does not request sorting.", required = "optional", examples = ['ordering = "price_descending"']}
decode = {description = "Encoding of a structured source field.", type = "string", required = "optional", values = ["json"], meanings.json = "JSON-encoded cell or value.", examples = ['decode = "json"']}
update_precision = {description = "Descriptive timestamp precision for updates.", required = "optional", examples = ['update_precision = "100ms"']}
snapshot_precision = {description = "Descriptive timestamp precision for snapshots.", required = "optional", examples = ['snapshot_precision = "second"']}
level_fields = {description = "Object members for a depth level.", type = "table", required = "optional", children = "LevelFields", constraints = ["Use either positional or object level mappings. A mapping-local level_fields table cannot override a raw field's layout."], examples = ['level_fields = { price = "p", quantity = "q" }']}

[annotations.LevelFields]
price = {description = "Nonempty price member name in an object level.", type = "string", examples = ['price = "p"']}
quantity = {description = "Nonempty quantity member name in an object level.", type = "string", examples = ['quantity = "q"']}
order_count = {description = "Optional nonempty order count member in the same object level.", type = "string", required = "optional", examples = ['order_count = "n"']}

[annotations.normalization]
quantity_encoding = {description = "Select the units recorded by the vendor before canonical conversion. Compare a normalized sample to the raw price and size.", related = ["normalization.quantity", "normalization.bids", "normalization.asks"], enum = "normalization.QuantityEncoding", meanings = {base = "The vendor measures size in units of the underlying asset.", quote = "The vendor measures size in the quote currency.", contracts = "The vendor reports a count of contracts. Requires a compatible derivative instrument. Spot and equity reject it."}, examples = ['quantity_encoding = "base"']}
target = {description = "Canonical operation for a single target or one rule.", enum = "catalogue.RuleTarget", required = "conditional", meanings = {trade = "Canonical trade.", l2_snapshot = "Depth snapshot or bounded observation.", l2_update = "Depth update."}, dependencies = ["At normalization level, choose target or a nonempty rules array. Each rule item requires its own target. Targets must be unique and agree with profile content."], examples = ['target = "l2_snapshot"']}
rules = {description = "Nonempty array of target-specific rules.", type = "array of table", required = "conditional", constraints = ["No rule key can override a common normalization key."], related = ["normalization.target"], examples = ["[[normalization.rules]]", 'target = "l2_snapshot"']}
book = {description = "Depth sequence consistency and descriptive book metadata.", type = "table", required = "optional", children = "Book", examples = ["[normalization.book]"]}

[annotations."trade.TradeSpec"]
event_timestamp = {description = "Canonical event timestamp. Must name an encoded source field via field.", children = "EventField", examples = ['event_timestamp = { field = "timestamp" }']}
system_timestamp = {description = "Optional source system timestamp. ISO 8601 requires matching string encoding on both mapped timestamps.", children = "trade.FieldSpec", examples = ['system_timestamp = { field = "system_time" }']}
price = {description = "Execution price.", children = "trade.FieldSpec", examples = ['price = { field = "price" }']}
quantity = {description = "Execution quantity and optional absolute-value conversion.", children = "trade.QuantitySpec", examples = ['quantity = { field = "size" }']}
side = {description = "Trade direction mapping.", children = "trade.SideSpec", examples = ['side = { field = "side", transform = "casefold" }']}
trade_id = {description = "Optional native execution ID mapping.", children = "trade.FieldSpec", examples = ['trade_id = { field = "trade_id" }']}
sequence = {description = "Optional native trade sequence mapping.", children = "trade.FieldSpec", examples = ['sequence = { field = "sequence" }']}
optional = {description = "Optional canonical trade flags.", children = "trade.OptionalTradeFields", examples = ["[normalization.optional.is_rpi]"]}

[annotations.trade_instrument]
instrument = {description = "Optional native symbol mapping for mixed-instrument trades.", type = "table", required = "optional", children = "TradeInstrument", constraints = ["Exactly field and lookup=catalog are allowed."], examples = ['instrument = { field = "symbol", lookup = "catalog" }']}
[annotations.TradeInstrument]
field = {description = "Name of the raw symbol field.", type = "string", examples = ['field = "symbol"']}
lookup = {description = "Resolve native symbol against prepared catalogue bindings.", type = "string", values = ["catalog"], meanings.catalog = "Use catalogue identity.", examples = ['lookup = "catalog"']}
[annotations.EventField]
field = {description = "Declared source column or JSON path for event time.", type = "string", required = "conditional", dependencies = ["An effective trade or depth operation needs an event timestamp. Map an encoded raw field."], related = ["fields.<name>.encoding"], examples = ['field = "timestamp"']}

[annotations."trade.FieldSpec"]
field = {description = "Declared source column or literal JSON path.", alias = "source", examples = ['field = "timestamp"']}
[annotations."trade.QuantitySpec"]
field = {description = "Declared source quantity field.", alias = "source", examples = ['field = "size"']}
transform = {description = "Transform the raw trade quantity before conversion to canonical units.", enum = "trade.QuantityTransform", meanings.abs = "Use the absolute value. Omission preserves the source value.", examples = ['transform = "abs"']}
[annotations."trade.SideSpec"]
field = {description = "Source side token or signed quantity.", alias = "source", examples = ['field = "side"']}
transform = {description = "Decode trade side.", enum = "trade.SideTransform", meanings = {casefold = "Case-insensitive native buy/sell token.", map = "Lookup using a lowercased token.", sign_to_side = "Select configured positive or negative trade side. Zero is invalid."}, examples = ['transform = "casefold"']}
values = {description = "Map lowercased source tokens to buy, sell, or unknown.", required = "conditional", dependencies = ["Required and nonempty for transform=map."], related = ["normalization.side.transform"], examples = ['values = { b = "buy", s = "sell" }']}
positive = {description = "Trade side for positive source quantity.", required = "conditional", dependencies = ["Required for sign_to_side along with negative. Use a buy or sell token."], examples = ['positive = "buy"']}
negative = {description = "Trade side for negative source quantity.", required = "conditional", dependencies = ["Required for sign_to_side along with positive. Use a buy or sell token."], examples = ['negative = "sell"']}
[annotations."trade.OptionalTradeFields"]
is_rpi = {description = "Optional retail-price-improvement flag.", children = "trade.BoolSpec", examples = ['is_rpi = { field = "RPI", transform = "bool" }']}
[annotations."trade.BoolSpec"]
field = {description = "Declared flag field.", alias = "source", examples = ['field = "RPI"']}
transform = {description = "Decode the optional boolean flag.", enum = "trade.BoolTransform", meanings = {bool = "Parse a boolean-compatible source flag.", equals = "Compare the source value to value."}, examples = ['transform = "bool"']}
value = {description = "Comparison operand.", required = "conditional", dependencies = ["Required for equals."], examples = ['value = "Y"']}

[annotations."depth.DepthRules"]
event_timestamp = {description = "Canonical event timestamp. Must name an encoded source field via field.", children = "EventField", examples = ['event_timestamp = { field = "timestamp" }']}
system_timestamp = {description = "Optional system timestamp. ISO 8601 requires matching string encoding on both timestamps.", children = "depth.FieldSpec", examples = ['system_timestamp = { field = "system_time" }']}
instrument = {description = "Optional source instrument binding.", children = "depth.InstrumentFieldSpec", examples = ['instrument = { field = "symbol", lookup = "catalog" }']}
event_filter = {description = "Select depth source records for this operation.", children = "depth.EventFilter", examples = ['event_filter = { field = "type", equals = "snapshot" }']}
snapshot = {description = "Snapshot or bounded-observation operation.", required = "conditional", children = "depth.SnapshotSpec", dependencies = ["Provide snapshot for l2_snapshot. Mutually exclusive with update_semantics."], examples = ['snapshot = { type = "single_event" }']}
update_semantics = {description = "Absolute or relative depth update operation.", required = "conditional", children = "depth.UpdateSemanticsSpec", dependencies = ["Provide update_semantics for l2_update. Mutually exclusive with snapshot."], examples = ['update_semantics = { type = "absolute_level" }']}
bids = {description = "Bid-array mapping.", required = "conditional", children = "depth.LevelArraySpec", dependencies = ["Requires asks. Mutually exclusive with scalar price, quantity and side."], examples = ['bids = { field = "bids" }']}
asks = {description = "Ask-array mapping.", required = "conditional", children = "depth.LevelArraySpec", dependencies = ["Requires bids. Mutually exclusive with scalar price, quantity and side."], examples = ['asks = { field = "asks" }']}
price = {description = "Scalar level price mapping.", required = "conditional", children = "depth.FieldSpec", dependencies = ["Use with scalar quantity and side rather than bid/ask arrays."], examples = ['price = { field = "price" }']}
quantity = {description = "Scalar level quantity mapping.", required = "conditional", children = "depth.QuantityFieldSpec", dependencies = ["Use with scalar price and side."], examples = ['quantity = { field = "size", transform = "abs" }']}
side = {description = "Scalar level side mapping.", required = "conditional", children = "depth.SideSpec", dependencies = ["Use with scalar price and quantity."], examples = ['side = { field = "size", transform = "sign_to_book_side" }']}
sequence_start = {description = "Source sequence or update identifier. Without sequence_count this does not establish ranged continuity.", children = "depth.FieldSpec", examples = ['sequence_start = { field = "begin_id" }']}
sequence_count = {description = "Count covered by a source range.", children = "depth.FieldSpec", dependencies = ["Requires sequence_start. Forbidden for bounded observations."], examples = ['sequence_count = { field = "merged_count" }']}
input_ordering = {description = "Request the supported depth input sort.", required = "conditional", children = "depth.InputOrderingSpec", dependencies = ["Required for XLSX. Sort only ascending by the mapped event timestamp."], examples = ['input_ordering = { order = "ascending", sort_by = "timestamp" }']}

[annotations."depth.FieldSpec"]
field = {description = "Name of a declared raw column or JSON path.", alias = "source", examples = ['field = "timestamp"']}
[annotations."depth.InstrumentFieldSpec"]
field = {description = "Name of the raw symbol field.", alias = "source", examples = ['field = "symbol"']}
lookup = {description = "Optional catalogue lookup selector.", values = ["catalog"], meanings.catalog = "Use the prepared catalogue bindings.", examples = ['lookup = "catalog"']}
[annotations."depth.EventFilter"]
field = {description = "Declared source discriminator field.", alias = "source", examples = ['field = "type"']}
equals = {description = "Select an exact source token.", required = "conditional", dependencies = ["Set exactly one of equals and in."], examples = ['equals = "snapshot"']}
in = {description = "Select from a nonempty list of source tokens.", required = "conditional", dependencies = ["Set exactly one of equals and in."], examples = ['in = ["make", "take"]']}
[annotations."depth.SnapshotSpec"]
type = {description = "Snapshot assembly or observation mode.", values = ["single_event", "single_row", "group_rows", "bounded_observation"], meanings = {single_event = "One native book event.", single_row = "One row provides the complete snapshot.", group_rows = "Multiple scalar levels form a snapshot.", bounded_observation = "Fixed-depth standalone observation without inferred continuity."}, examples = ['type = "single_event"']}
group_by = {description = "Declared raw grouping field for a multi-row snapshot.", required = "conditional", dependencies = ["Required for group_rows. Forbidden for bounded_observation."], examples = ['group_by = "timestamp"']}
levels_per_side = {description = "Number of levels per side for a bounded observation.", required = "conditional", constraints = ["Positive unsigned 32-bit value."], dependencies = ["Requires bounded_observation and matching source.maximum_depth_per_side. Requires chronological JSONL, bid/ask arrays and single-target form."], examples = ["levels_per_side = 10"]}
sequence_order = {description = "Ordering rule for optional bounded-observation sequence evidence.", values = ["nondecreasing"], meanings.nondecreasing = "Permit equal adjacent IDs and forward jumps. Reject decreases.", dependencies = ["Only bounded_observation. Required if that operation maps sequence_start and forbidden if it does not."], examples = ['sequence_order = "nondecreasing"']}
[annotations."depth.UpdateSemanticsSpec"]
type = {description = "Update interpretation.", values = ["absolute_level", "relative_level"], meanings = {absolute_level = "Source quantity sets or removes a level.", relative_level = "Supported scalar CSV updates use an action to add or subtract and emit the resulting absolute quantity."}, examples = ['type = "absolute_level"']}
zero_quantity = {description = "Interpret zero source quantity.", values = ["delete"], meanings.delete = "Remove the level.", examples = ['zero_quantity = "delete"']}
nonzero_quantity = {description = "Interpret nonzero source quantity.", values = ["set"], meanings.set = "Set the absolute level.", examples = ['nonzero_quantity = "set"']}
action_source = {description = "Declared raw action field for a relative update.", required = "conditional", dependencies = ["Required for relative_level with add_action and subtract_action."], examples = ['action_source = "action"']}
add_action = {description = "Source token that adds to a level.", required = "conditional", dependencies = ["Required for relative_level."], examples = ['add_action = "make"']}
subtract_action = {description = "Source token that subtracts from a level.", required = "conditional", dependencies = ["Required for relative_level."], examples = ['subtract_action = "take"']}
emit = {description = "Canonical row representation for relative changes.", values = ["resulting_absolute_level"], meanings.resulting_absolute_level = "Emit the resulting absolute size.", examples = ['emit = "resulting_absolute_level"']}
zero_result = {description = "Interpret a zero resulting size.", values = ["delete"], meanings.delete = "Remove the level.", examples = ['zero_result = "delete"']}
nonzero_result = {description = "Interpret a nonzero resulting size.", values = ["set"], meanings.set = "Set the resulting level.", examples = ['nonzero_result = "set"']}
[annotations."depth.LevelArraySpec"]
field = {description = "Declared raw bid or ask collection.", alias = "source", examples = ['field = "data.b"']}
price_index = {description = "Explicit zero-based price position in a positional level.", constraints = ["Zero when omitted and not derived from level_format. Positional levels require distinct indices."], examples = ["price_index = 0"]}
quantity_index = {description = "Explicit zero-based size position in a positional level.", constraints = ["Zero when omitted and not derived from level_format. Set the indices explicitly or declare level_format so they differ."], examples = ["quantity_index = 1"]}
price_field = {description = "Explicit object price member.", required = "conditional", dependencies = ["Supply price_field and quantity_field together or use level_fields to declare them."], examples = ['price_field = "p"']}
quantity_field = {description = "Explicit object size member.", required = "conditional", dependencies = ["Supply price_field and quantity_field together."], examples = ['quantity_field = "s"']}
order_count_index = {description = "Optional unsigned zero-based order count position for positional levels.", dependencies = ["Not compatible with object price and quantity members."], examples = ["order_count_index = 2"]}
order_count_field = {description = "Optional nonempty order count member for object levels.", dependencies = ["Requires object price and quantity members."], examples = ['order_count_field = "count"']}
decode = {description = "Optional level-array decoding.", values = ["json"], meanings.json = "Decode a JSON-encoded level collection.", examples = ['decode = "json"']}

[annotations."depth.QuantityFieldSpec"]
field = {description = "Declared scalar quantity field.", alias = "source", examples = ['field = "size"']}
transform = {description = "Optional depth quantity transform.", values = ["abs"], meanings.abs = "Use the absolute value. Without it the source quantity must be nonnegative." , examples = ['transform = "abs"']}
[annotations."depth.SideSpec"]
field = {description = "Declared scalar side field, or signed quantity input.", alias = "source", examples = ['field = "size"']}
transform = {description = "Optional scalar side decoding. Omission reads a literal bid or ask string.", values = ["map", "sign_to_book_side"], meanings = {map = "Map an exact string or numeric token to bid or ask.", sign_to_book_side = "Positive quantity is bid, negative is ask, zero is invalid."}, examples = ['transform = "sign_to_book_side"']}
values = {description = "Nonempty source-to-side table when using map.", type = "table", required = "conditional", dependencies = ["Required for map. Each result must be bid or ask."], examples = ['values = { b = "bid", a = "ask" }']}
positive = {description = "Optional declaration of the positive sign interpretation.", values = ["bid"], meanings.bid = "Positive quantity represents a bid.", examples = ['positive = "bid"']}
negative = {description = "Optional declaration of the negative sign interpretation.", values = ["ask"], meanings.ask = "Negative quantity represents an ask.", examples = ['negative = "ask"']}
[annotations."depth.InputOrderingSpec"]
order = {description = "Requested direction.", values = ["ascending"], meanings.ascending = "Oldest event timestamp first.", examples = ['order = "ascending"']}
sort_by = {description = "Declared sort field. Must match the effective event timestamp source.", related = ["normalization.event_timestamp.field"], examples = ['sort_by = "timestamp"']}

[annotations.LevelFieldsMapping]
level_fields = {description = "Mapping-local alternative to positional or raw-field object layout.", type = "table", required = "optional", children = "LevelFields", dependencies = ["Requires field. Cannot override level_format or level_fields in the raw declaration."], examples = ['level_fields = { price = "p", quantity = "s" }']}

[annotations.Book]
update_id = {description = "Declare the update identifier, or set this key to false to record its absence.", type = "table or false", required = "optional", constraints = ["A table must equal the common sequence_start mapping."], children = "BookField", examples = ['update_id = { field = "data.u" }']}
cross_sequence = {description = "Descriptive cross-sequence table. It does not establish book continuity.", type = "table", required = "optional", children = "BookField", examples = ['cross_sequence = { field = "data.seq" }']}
sequence_id = {description = "Explicitly record absence of sequence identity.", type = "boolean", required = "optional", values = [false], meanings.false = "No sequence identity.", examples = ["sequence_id = false"]}
snapshot_resets_book = {description = "Assert snapshot reset semantics of the source.", type = "boolean", required = "optional", values = [true], meanings.true = "Assert the source reset convention. The executable snapshot operation comes from the target and snapshot mapping.", examples = ["snapshot_resets_book = true"]}
snapshot_depth = {description = "Descriptive snapshot depth metadata. This key is not a truncation control.", type = "descriptive TOML value", required = "optional", children = "BookDepth", examples = ["snapshot_depth = { bids = 200, asks = 200 }"]}
update_frequency = {description = "Descriptive native update frequency. No enforced unit or timing guarantee.", required = "optional", examples = ['update_frequency = "approximately_1_second"']}
snapshot_frequency = {description = "Descriptive native snapshot frequency. No enforced unit or timing guarantee.", required = "optional", examples = ['snapshot_frequency = "approximately_15_minutes"']}
sequence = {description = "Evidence matching the common consecutive-range mapping.", required = "optional", type = "table", children = "BookSequence", examples = ["[normalization.book.sequence]"]}
[annotations.BookField]
field = {description = "Source field name used in the book declaration. Its role is defined by the containing declaration.", type = "string", required = "optional", examples = ['field = "data.u"']}
[annotations.BookDepth]
bids = {description = "Conventional declared bid depth, descriptive.", type = "TOML value", required = "optional", examples = ["bids = 200"]}
asks = {description = "Conventional declared ask depth, descriptive.", type = "TOML value", required = "optional", examples = ["asks = 200"]}
[annotations.BookSequence]
continuity_rule = {description = "Recognized ranged continuity declaration.", type = "string", values = ["next.begin_id = current.begin_id + current.merged_count"], meanings."next.begin_id = current.begin_id + current.merged_count" = "Next range starts after the current range, using the declared count.", examples = ['continuity_rule = "next.begin_id = current.begin_id + current.merged_count"']}
begin_id = {description = "When supplied, the declaration must match common sequence_start.", type = "table", required = "conditional", children = "BookField", examples = ['begin_id = { field = "begin_id" }']}
merged_count = {description = "When supplied, the declaration must match common sequence_count.", type = "table", required = "conditional", children = "BookField", examples = ['merged_count = { field = "merged_count" }']}
