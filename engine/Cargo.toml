[package]
name = "marketforge-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []

historical = [
    "dep:flate2",
    "dep:csv",
    "dep:zip",
    "dep:tar",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:arrow-buffer",
    "dep:parquet",
    "dep:quick-xml",
    "dep:arrow-select",
    "dep:num-bigint",
    "dep:num-traits",
    "dep:rustix",
    "dep:num-integer",
]

live = [
    "dep:toml",
    "dep:tokio",
    "dep:rand",
    "dep:url",
    "dep:reqwest",
    "dep:tokio-tungstenite",
    "dep:futures-util",
]


monitor-tui = ["dep:ratatui", "dep:crossterm"]
arrow-select = ["dep:arrow-select"]


[dependencies]
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"], optional = true }
clap = { version = "4.6.7", features = ["derive"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
thiserror = "2.0.21"
flate2 = { version = "1", optional = true }
csv = { version = "1", optional = true }
zip = { version = "9", optional = true }
tar = { version = "0.4", optional = true }
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
parquet = { version = "60", features = ["arrow", "zstd"], optional = true }
arrow-buffer = { version = "60", optional = true }
sha2 = "0.11"
quick-xml = { version = "0.42", optional = true }
arrow-select = { version = "60", optional = true }
num-bigint = { version = "0.5", optional = true }
num-traits = { version = "0.2", optional = true }
rustix = { version = "1", features = ["fs"], optional = true }
num-integer = { version = "0.1", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
toml = { version = "1.1.8", optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
rand = { version = "0.10.3", optional = true }
url = { version = "2.5.8", optional = true }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false, optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3.34", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "marketforge-process"
path = "src/bin/marketforge-process.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-live"
path = "src/bin/marketforge-live.rs"
required-features = ["live"]

[[bin]]
name = "marketforge-process-benchmark"
path = "src/bin/marketforge-process-benchmark.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-merge"
path = "src/bin/marketforge-merge.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-merge-benchmark"
path = "src/bin/marketforge-merge-benchmark.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-convert"
path = "src/bin/marketforge-convert.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-convert-benchmark"
path = "src/bin/marketforge-convert-benchmark.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-process-tui-demo"
path = "src/bin/marketforge-process-tui-demo.rs"
required-features = ["monitor-tui"]

