[package]
name = "marketforge-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
stream-client = ["dep:tokio"]
management-api = ["live", "dep:axum", "dep:tokio-stream", "dep:toml_edit"]
management-client = ["dep:reqwest", "dep:tokio", "dep:futures-util"]
management-tui = ["management-client", "monitor-tui"]
postgres = ["dep:sqlx"]
historical-slow-tests = ["historical"]
historical = [
    "dep:toml",
    "parquet",
    "dep:flate2",
    "dep:csv",
    "dep:zip",
    "dep:tar",
    "dep:quick-xml",
    "dep:arrow-select",
    "dep:rustix",
]
parquet = [
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:parquet"
]
live = [
    "postgres",
    "dep:hyper",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:libc",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:toml",
    "dep:tokio",
    "dep:rand",
    "dep:url",
    "dep:reqwest",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:parking_lot",
]
monitor-tui = [
    "dep:ratatui",
    "dep:crossterm"
]
arrow-select = [
   "dep:arrow-select"
]

[dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["json"], optional = true }
libc = { version = "0.2", optional = true }
hyper = { version = "1.12.0", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
ciborium = "0.2.2"
parking_lot = { version = "0.12.5", optional = true }
toml_edit = {
    version = "=0.25.17",
    default-features = false,
    features = ["parse", "display"],
    optional = true
}
clap = { version = "4.6.7", features = ["derive"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
thiserror = "2.0.21"
flate2 = { version = "1", optional = true }
csv = { version = "1", optional = true }
zip = { version = "9", optional = true }
tar = { version = "0.4", optional = true }
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
parquet = { version = "60", features = ["arrow", "zstd"], optional = true }
arrow-buffer = "60"
sha2 = "0.11"
quick-xml = { version = "0.42", optional = true }
arrow-select = { version = "60", optional = true }
num-bigint = "0.5"
num-traits = "0.2"
rustix = { version = "1", features = ["fs"], optional = true }
num-integer = "0.1"
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
toml = { version = "1.1.8", optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
rand = { version = "0.10.3", optional = true }
url = { version = "2.5.8", optional = true }
reqwest = {
    version = "0.12.28",
    default-features = false,
    features = ["json", "rustls-tls", "stream"],
    optional = true
}
tokio-tungstenite = {
    version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true
}
futures-util = { version = "0.3.34", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = [
        "runtime-tokio",
        "postgres",
        "migrate",
        "macros",
        "rust_decimal"
   ],
   optional = true
}

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "marketforge-normalize"
path = "src/bin/marketforge-normalize.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-live"
path = "src/bin/marketforge-live.rs"
required-features = ["live"]

[[bin]]
name = "marketforge-normalize-benchmark"
path = "src/bin/marketforge-normalize-benchmark.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-merge"
path = "src/bin/marketforge-merge.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-merge-benchmark"
path = "src/bin/marketforge-merge-benchmark.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-convert"
path = "src/bin/marketforge-convert.rs"
required-features = ["historical"]

[[bin]]
name = "marketforge-convert-benchmark"
path = "src/bin/marketforge-convert-benchmark.rs"
required-features = ["historical"]

