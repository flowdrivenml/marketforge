# Sanitized application example. Uses the existing exchange/format directory.
# Build with management-api to start the authenticated loopback administrative API.
schema_version = 1

[runtime]
shutdown_timeout_seconds = 15

[publication]
socket_path = "data/.live/marketforge-data.sock"
max_connections = 64
subscriber_queue_bytes = 16777216

[control]
listen_address = "127.0.0.1:8080"

[control.management]
# JSON credential array supplied by the environment, or configure credentials_file.
# No credentials are embedded in this example.
credentials_env = "MARKETFORGE_MANAGEMENT_CREDENTIALS"
command_capacity = 32
active_operations = 16
operation_history = 256
plans = 128
leases = 128
event_history = 256
max_clients = 128
max_requests = 64
sse_clients = 16
max_body_bytes = 65536
max_response_bytes = 4194304
max_workers = 64
plan_seconds = 60
lease_max_seconds = 300
request_timeout_ms = 10000
overview_interval_ms = 1000

[recording]
enabled = false
batch_max_records = 10000
batch_max_delay_ms = 100

[metrics]
enabled = true
snapshot_interval_ms = 1000

[metrics.prometheus]
enabled = true
listen_address = "127.0.0.1:9091"
path = "/metrics"
max_concurrent_requests = 8
max_response_bytes = 4194304
cache_interval_ms = 1000

[logging]
level = "info"

[defaults.recovery]
initial_backoff_ms = 500
max_backoff_seconds = 60
jitter = true

# =============================================================================
# CPU PROCESSING RUNTIME
# =============================================================================

[runtime.processing]

# Dedicated CPU-processing workers.
workers = 4
# Maximum runnable processor activations waiting for a worker.
ready_queue_capacity = 1024
# Maximum events processed by one processor during a scheduling turn.
max_events_per_turn = 512
