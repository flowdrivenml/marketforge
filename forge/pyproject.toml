[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "marketforge"
version = "0.1.0"
description = "Acquire, normalize, validate, and merge free historical tick-level market microstructure data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "requests",
    "beautifulsoup4",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
marketforge = "marketforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
