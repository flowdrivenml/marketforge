schema_version = 2
kind = "profile"
id = "binance.future.inverse.trades"
format_code = "BINANCE-T3"
exchange = "binance"
instrument_type = "future"
market_category = "inverse"

[source]
container = "zip"
format = "csv"
record_format = "rows"
header = true
ordering = "chronological"
granularity = "daily"

# Field keys are literal source column names or JSON paths.
[fields.id]
type = "integer"

[fields.price]
type = "decimal"

[fields.qty]
type = "decimal"

[fields.base_qty]
type = "decimal"

[fields.time]
type = "integer"
encoding = "unix_milliseconds"

[fields.is_buyer_maker]
type = "boolean"

[normalization]
target = "trade"
quantity_encoding = "contracts"

[normalization.event_timestamp]
field = "time"

[normalization.trade_id]
field = "id"

[normalization.quantity]
field = "qty"

[normalization.price]
field = "price"

[normalization.side]
transform = "map"
field = "is_buyer_maker"

[normalization.side.values]
true = "sell"
false = "buy"
