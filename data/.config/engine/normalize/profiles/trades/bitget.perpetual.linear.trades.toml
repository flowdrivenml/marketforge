schema_version = 2
kind = "profile"
id = "bitget.perpetual.linear.trades"
format_code = "BITGET-T1"
exchange = "bitget"
instrument_type = "perpetual"
market_category = "linear"

[source]
container = "zip"
format = "csv"
record_format = "rows"
header = true
ordering = "chronological"
granularity = "daily"
daily_packaging = "numbered_zip_chunks"
# Public native trade IDs, checked over the supplied non-reset run. IDs must
# survive decoding, increase in source order after deduplication, and agree
# with the chronological union. Missing IDs, reuse/conflicts and resets fail.
# This does not assert uniqueness outside that validated run. Spot/perpetual
# domains intentionally differ. See docs/historical/bitget-trade-reconciliation.md.
trade_id_scope = "ordered_run"
trade_id_reset_domain = "bitget.linear.perpetual.public-fills.ordered-run.v1"
archive_day_boundary = "UTC+8"

# Field keys are literal source column names or JSON paths.
[fields.trade_id]
type = "integer/string"

[fields.timestamp]
type = "integer"
observed_effective_precision = "second"
encoding = "unix_milliseconds"

[fields.price]
type = "decimal"

[fields.side]
type = "string"

[fields."volume(quote)"]
type = "decimal"

[fields."size(base)"]
type = "decimal"

[normalization]
target = "trade"
quantity_encoding = "base"

[normalization.event_timestamp]
field = "timestamp"

[normalization.trade_id]
field = "trade_id"

[normalization.quantity]
field = "size(base)"

[normalization.price]
field = "price"

[normalization.side]
transform = "casefold"
field = "side"
