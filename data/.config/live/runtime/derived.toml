# =============================================================================
# MarketForge Live — Derived Stream Integration Tests
# =============================================================================
#
# Purpose:
#   Test merging, event-time ordering, L2 generation boundaries,
#   derived dependencies, currency conversion, and failure handling.
#
# All source IDs refer to runtime/sources.toml.
#
# IMPORTANT:
#   This is the proposed schema v1 configuration.
#   The Rust configuration compiler must implement and validate these fields.
#
#   Conversion targets and paths must be resolved through the
#   authoritative instrument catalog and currency-reference registry.
#
# =============================================================================

schema_version = 1


# =============================================================================
# 1. CROSS-EXCHANGE TRADE MERGE
# =============================================================================
#
# Tests:
#   - Multiple exchange sources.
#   - Event-time reordering.
#   - Equal-timestamp deterministic tie-breaking.
#   - Source disconnection and reconnection.
#   - Partial source availability.
#
# Both sources represent Spot BTC/USDT.
#
# =============================================================================

[[derived]]
id = "btc_spot_trades_merged"
type = "merge"
enabled = true
record = false

sources = [
    "binance_spot_btcusdt_trades",
    "bybit_spot_btcusdt_trades",
    "okx_spot_btcusdt_trades",
]

[derived.merge]
mode = "trades"
ordering = "adaptive_event_time"

initial_window_ms = 10
max_window_ms = 500

late_event_policy = "emit_late"
source_failure_policy = "continue_degraded"


# =============================================================================
# 2. CROSS-EXCHANGE DEPTH MERGE
# =============================================================================
#
# Tests:
#   - Independent L2 book generations.
#   - Snapshot initialization boundaries.
#   - Atomic depth-update groups.
#   - Sequence-gap invalidation.
#   - Source-specific resynchronization.
#   - Event-time ordering between exchanges.
#
# IMPORTANT:
#   This interleaves L2 events from independent books.
#   It does NOT create one consolidated order book.
#
# =============================================================================

[[derived]]
id = "btc_spot_depth_merged"
type = "merge"
enabled = true
record = false

sources = [
    "binance_spot_btcusdt_depth",
    "bybit_spot_btcusdt_depth",
    "okx_spot_btcusdt_depth",
]

[derived.merge]
mode = "depth"
ordering = "adaptive_event_time"

initial_window_ms = 20
max_window_ms = 1000

late_event_policy = "emit_late"
source_failure_policy = "continue_degraded"


# =============================================================================
# 3. MIXED TRADES + DEPTH TIMELINE
# =============================================================================
#
# Tests:
#   - Trades and L2 updates in the same output stream.
#   - Historical-compatible event_kind discrimination.
#   - Ordering between different event types.
#   - Deterministic ordering for equal timestamps.
#   - Atomic L2 message boundaries.
#   - Trade activity during L2 synchronization failures.
#
# Single exchange, single instrument, two independent source channels.
#
# =============================================================================

[[derived]]
id = "binance_btc_spot_combined"
type = "merge"
enabled = true
record = false

sources = [
    "binance_spot_btcusdt_trades",
    "binance_spot_btcusdt_depth",
]

[derived.merge]
mode = "combined"
ordering = "adaptive_event_time"

initial_window_ms = 10
max_window_ms = 250

late_event_policy = "emit_late"
source_failure_policy = "continue_degraded"


# =============================================================================
# 4. DERIVED STREAM DEPENDING ON ANOTHER DERIVED STREAM
# =============================================================================
#
# Tests:
#   - Derived -> derived dependencies.
#   - Shared source acquisition.
#   - Dependency DAG validation.
#   - Propagation of upstream health.
#   - Independent derived cursor identity.
#   - No duplicate Binance/Bybit/OKX subscriptions.
#
# The first input is itself a three-exchange BTC/USDT trade merge.
# The second input adds Bitget BTC/USDT Spot trades.
#
# =============================================================================

[[derived]]
id = "btc_spot_trades_extended"
type = "merge"
enabled = true
record = false

sources = [
    "btc_spot_trades_merged",
    "bitget_spot_btcusdt_trades",
]

[derived.merge]
mode = "trades"
ordering = "adaptive_event_time"

initial_window_ms = 15
max_window_ms = 500

late_event_policy = "emit_late"
source_failure_policy = "continue_degraded"


# =============================================================================
# 5. BYBIT ETH/BTC -> ETH/USDT CONVERSION
# =============================================================================
#
# Tests:
#   - Currency conversion through an external reference stream.
#   - Multi-hop asset denomination.
#   - Exact Decimal arithmetic.
#   - Event-time reference selection.
#   - Missing reference observations.
#   - Stale reference observations.
#   - Source event immutability.
#
# Conversion:
#
#   ETH/BTC * BTC/USDT = ETH/USDT
#
# Source:
#   bybit_spot_ethbtc_trades
#
# Reference:
#   bybit_spot_btcusdt_trades
#
# IMPORTANT:
#   ETHBTC is disabled in sources.toml pending venue/catalog verification.
#   Enable this derived stream after its prerequisites are validated.
#
# =============================================================================

[[derived]]
id = "bybit_ethbtc_to_usdt"
type = "conversion"
enabled = false
record = false

source = "bybit_spot_ethbtc_trades"

[derived.conversion]
target_currency = "USDT"

reference_policy = "event_time"
max_reference_age_ms = 5000

missing_reference_policy = "publish_unavailable"
path_resolution = "automatic"


# =============================================================================
# 6. BYBIT BTC/USDC -> BTC/USDT CONVERSION
# =============================================================================
#
# Tests:
#   - Stablecoin denomination is NOT assumed equivalent.
#   - Explicit conversion reference requirements.
#   - Missing conversion path.
#   - Conversion-unavailable event status.
#   - Recovery after a reference source becomes available.
#
# Desired:
#
#   BTC/USDC * USDC/USDT = BTC/USDT
#
# IMPORTANT:
#   BTCUSDC is disabled in sources.toml pending verification.
#
#   No USDC/USDT reference source is configured in our
#   initial sources.toml.
#
#   This definition intentionally tests missing-path handling.
#   The compiler must distinguish an invalid configuration
#   from a valid but temporarily unavailable reference.
#
#   Do not assume USDC == USDT.
#
# =============================================================================

[[derived]]
id = "bybit_btcusdc_to_usdt"
type = "conversion"
enabled = false
record = false

source = "bybit_spot_btcusdc_trades"

[derived.conversion]
target_currency = "USDT"

reference_policy = "event_time"
max_reference_age_ms = 5000

missing_reference_policy = "publish_unavailable"
path_resolution = "automatic"