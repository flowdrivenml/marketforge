# MarketForge Live — initial multi-exchange smoke-test sources
# Proposed schema v1; all symbols must resolve through the instrument catalog.
# Spot/linear use BTCUSDT. Inverse uses BTCUSD (USD-quoted, BTC-settled).
# Exchange-specific native symbols, routes, depth limits and update intervals come from compiled exchange profiles.
# Activating all streams simultaneously is an integration/load test; set enabled=false selectively for incremental tests.
schema_version = 1

# --- BINANCE ---
[[sources]]
id = "binance_spot_btcusdt_trades"
exchange = "binance"
market = "spot"
instrument = "BTCUSDT"
channel = "trades"
enabled = true
record = false

[[sources]]
id = "binance_spot_btcusdt_depth"
exchange = "binance"
market = "spot"
instrument = "BTCUSDT"
channel = "depth"
enabled = true
record = false

