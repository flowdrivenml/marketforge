# MarketForge Live — Bybit Linear L2 Order Book
#
# Proposed MarketForge Live format schema v1.
#
# Official references:
# https://bybit-exchange.github.io/docs/v5/websocket/public/orderbook
# https://bybit-exchange.github.io/docs/v5/market/orderbook
#
# Exchange: Bybit
# Market: Linear
# Channel: orderbook.{depth}.{symbol}
#
# Connectivity and REST:
# exchanges/bybit_linear.toml
#
# Instrument specifications:
# Python-managed MarketForge instrument catalog.
#
# Standard V5 order book.
# Full-depth and RPI-inclusive feeds are separate protocols.

schema_version = 1

[format]
id = "bybit_linear"
exchange = "bybit"
market = "linear"
channel = "depth"

encoding = "json"
target_schema = "canonical_l2_update"

# ============================================================
# MESSAGE IDENTIFICATION
# ============================================================

[message]
root = "$"

topic_field = "topic"
topic_pattern = "orderbook.{depth}.{symbol_upper}"

message_type_field = "type"

snapshot_type = "snapshot"
delta_type = "delta"

payload_path = "data"

records = "single"

# ============================================================
# FIELD EXTRACTION
# ============================================================

[fields]
symbol = "data.s"

update_id = "data.u"
cross_sequence = "data.seq"

message_timestamp = "ts"
matching_engine_timestamp = "cts"

# ============================================================
# FIELD TYPES
# ============================================================

[types]
symbol = "string"

update_id = "u64"
cross_sequence = "u64"

message_timestamp = "i64"
matching_engine_timestamp = "i64"

# ============================================================
# TIMESTAMP NORMALIZATION
# ============================================================

[timestamps]

# Matching-engine timestamp is preferred as canonical
# event time because it describes book production
# at the matching engine.

event_source = "matching_engine_timestamp"

source_unit = "milliseconds"
canonical_unit = "nanoseconds"

preserve_message_timestamp = true

# ============================================================
# BID LEVELS
# ============================================================

[levels.bids]
path = "data.b"

representation = "array"
level_type = "array"

price_index = 0
quantity_index = 1

price_type = "decimal_string"
quantity_type = "decimal_string"

side = "bid"

# ============================================================
# ASK LEVELS
# ============================================================

[levels.asks]
path = "data.a"

representation = "array"
level_type = "array"

price_index = 0
quantity_index = 1

price_type = "decimal_string"
quantity_type = "decimal_string"

side = "ask"

# ============================================================
# PRICE NORMALIZATION
# ============================================================

[normalization.price]
representation = "exact_decimal"

allow_zero = false
allow_negative = false

# ============================================================
# QUANTITY NORMALIZATION
# ============================================================

[normalization.quantity]

# Raw order-book quantities are interpreted using
# the authoritative instrument specifications.
#
# Required metadata may include:
#
# quantity_type
# contract_value
# contract_value_asset
#
# Do not assume that every linear instrument uses
# identical quantity or contract-size semantics.

quantity_semantics = "instrument_metadata"

representation = "exact_decimal"

allow_zero = true
allow_negative = false

# Bybit provides absolute quantities at price levels.
# Deltas replace the previous quantity rather than
# incrementing it.

update_mode = "absolute"

zero_quantity_action = "delete"

# ============================================================
# INSTRUMENT RESOLUTION
# ============================================================

[instrument]
source = "symbol"

resolver = "marketforge_instrument_catalog"

exchange = "bybit"
market = "linear"

require_known_instrument = true
validate_subscription_symbol = true

# Resolve normalization-critical metadata once
# during source-stream initialization.
#
# No per-event PostgreSQL queries.

# ============================================================
# NATIVE SEQUENCE
# ============================================================

[sequence]
strategy = "bybit_v5_orderbook"

update_id_field = "update_id"
cross_sequence_field = "cross_sequence"

preserve_update_id = true
preserve_cross_sequence = true

# Cross-sequence IDs represent ordering/version metadata.
# They must not be treated as exact missing-message counts.

cross_sequence_requires_consecutive = false

# The standard feed does not document a universal
# consecutive u+1 guarantee for all depth levels.
#
# Do not reuse Binance U/u/pu continuity rules.

require_consecutive_update_id = false

previous_update_id_required = false

# ============================================================
# SNAPSHOT / DELTA SYNCHRONIZATION
# ============================================================

[synchronization]
strategy = "bybit_v5_snapshot_delta"

snapshot_source = "websocket"

snapshot_message_type = "snapshot"
delta_message_type = "delta"

# Initial subscription establishes book state
# through a WebSocket snapshot.

require_initial_snapshot = true

# Every subsequent snapshot replaces the local book.

snapshot_action = "replace"

# Deltas must not initialize an uninitialized book.

delta_before_snapshot_action = "reject_and_resynchronize"

# Bybit may send a new snapshot with u=1 after
# a service restart.

reset_update_id = 1

# Interpret reset behavior together with message type.
# Do not assume every numeric u=1 message is a valid snapshot.

reset_action = "invalidate_and_await_snapshot"

# Level 1 is snapshot-only.
#
# A repeated snapshot with unchanged u is valid
# and must not be classified as a sequence error.

snapshot_only_depths = [1]

# ============================================================
# BOOK STATE
# ============================================================

[book]
storage = "marketforge_book_store"

snapshot_action = "replace"

delta_update_type = "absolute"

zero_quantity_action = "delete"

# Each message is applied atomically.
# Partial book updates must never become visible.

atomic_message_updates = true

require_valid_generation = true

# The selected depth defines the maintained book
# coverage. A synchronized 200-level book is not
# equivalent to complete exchange depth.

# ============================================================
# INTEGRITY VALIDATION
# ============================================================

[integrity]
reject_malformed_json = true
reject_missing_required_fields = true

reject_invalid_numeric_values = true
reject_nonpositive_price = true
reject_negative_quantity = true

detect_stale_updates = true
detect_update_id_regression = true
detect_cross_sequence_regression = true

# Do not infer missing message counts from cross-sequence gaps.

detect_cross_sequence_gaps = false

# No universal exact missing-update count can be inferred
# from standard depth u values.

detect_exact_missing_update_count = false

# Suspicious transitions are evaluated by the
# Bybit synchronization strategy.

sequence_violation_action = "invalidate_and_resynchronize"

# Standard Bybit V5 order-book messages do not expose
# a documented checksum field.

checksum_strategy = "none"

# ============================================================
# RECOVERY
# ============================================================

[recovery]
strategy = "bybit_v5_snapshot_recovery"

# A new authoritative snapshot reinitializes the book.

on_new_snapshot = "replace_book"

# Following connection loss, invalidate old book state
# and establish a new subscription generation.

on_connection_loss = "invalidate_and_resubscribe"

on_sequence_violation = "resubscribe"

# Although REST snapshots are available, the standard
# V5 WebSocket depth feed does not require REST
# initialization.
#
# Do not assume arbitrary REST/WebSocket snapshot
# joining is safe without a verified synchronization rule.

rest_snapshot_fallback = false

# Prevent delayed responses/messages from older
# generations modifying the current book.

require_generation_fencing = true

# Restoring current book validity does not recover
# historical L2 updates lost during disconnection.

# ============================================================
# CANONICAL OUTPUT
# ============================================================

[output]
snapshot_event_type = "l2_snapshot"
delta_event_type = "l2_update"

preserve_native_update_id = true
preserve_native_cross_sequence = true

preserve_event_timestamp = true
preserve_message_timestamp = true

preserve_source_provenance = true

atomic_updates = true

# The Live event envelope supplies:
#
# stream_id
# stream_cursor
# connection_generation
# subscription_generation
# book_generation
# received_timestamp_ns