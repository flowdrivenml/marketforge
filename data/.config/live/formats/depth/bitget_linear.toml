# MarketForge Live — Bitget Linear L2 Order Book
#
# Proposed MarketForge Live format schema v1.
#
# API generation: Unified Trading Account (UTA), V3
# Encoding: JSON WebSocket
#
# Official references:
# https://www.bitget.com/docs/uta/websocket/public/Order-Book-Channel
# https://www.bitget.com/docs/uta/changelog/2026-05
# https://www.bitget.com/docs/catalog/market/market-data
#
# Exchange: Bitget
# Market: Linear
# Channel: books
#
# Native categories:
#   usdt-futures
#   usdc-futures
#
# Connectivity:
# exchanges/bitget_linear.toml
#
# Instrument metadata:
# Python-managed MarketForge instrument catalog.
#
# IMPORTANT:
# - Initial snapshot followed by incremental updates.
# - Sequence continuity uses seq/pseq.
# - Snapshot-to-update bridging is required.
# - Checksum was removed in May 2026.
# - USDT/USDC quantity semantics require fixture validation.
# - RPI-inclusive order books use separate channels.

schema_version = 1

[format]
id = "bitget_linear"
exchange = "bitget"
market = "linear"
channel = "depth"

encoding = "json"
target_schema = "canonical_l2_update"

# ============================================================
# MESSAGE IDENTIFICATION
# ============================================================

[message]
root = "$"

topic_field = "arg.topic"
topic_value = "books"

instrument_type_field = "arg.instType"

supported_instrument_types = [
    "usdt-futures",
    "usdc-futures",
]

instrument_field = "arg.symbol"

action_field = "action"

snapshot_action = "snapshot"
update_action = "update"

payload_path = "data"

# ============================================================
# RECORD EXTRACTION
# ============================================================

[records]
path = "data"

representation = "array"
record_type = "object"

expected_records_per_message = 1

preserve_array_order = true

# ============================================================
# FIELD EXTRACTION
# ============================================================

[fields]
sequence_id = "seq"
previous_sequence_id = "pseq"

book_timestamp = "ts"
max_depth = "maxDepth"

# ============================================================
# ENVELOPE FIELDS
# ============================================================

[envelope]
instrument_type = "arg.instType"
channel = "arg.topic"
instrument = "arg.symbol"

message_action = "action"
message_timestamp = "ts"

# ============================================================
# FIELD TYPES
# ============================================================

[types]
sequence_id = "u64"
previous_sequence_id = "u64"

# Sequence fields are JSON numeric values in the
# official example. Parse without floating-point loss.

book_timestamp = "integer_string"

max_depth = "optional_integer_string"

# ============================================================
# TIMESTAMP NORMALIZATION
# ============================================================

[timestamps]
event_source = "book_timestamp"

source_unit = "milliseconds"
canonical_unit = "nanoseconds"

parse_integer_string = true

preserve_message_timestamp = true

# data[].ts: exchange data-generation timestamp.
# top-level ts: exchange push timestamp.
#
# Local receipt time is supplied by MarketForge.

# ============================================================
# BID LEVELS
# ============================================================

[levels.bids]
path = "b"

representation = "array"
level_type = "array"

price_index = 0
quantity_index = 1

price_type = "decimal_string"
quantity_type = "decimal_string"

side = "bid"

# ============================================================
# ASK LEVELS
# ============================================================

[levels.asks]
path = "a"

representation = "array"
level_type = "array"

price_index = 0
quantity_index = 1

price_type = "decimal_string"
quantity_type = "decimal_string"

side = "ask"

# ============================================================
# PRICE NORMALIZATION
# ============================================================

[normalization.price]
representation = "exact_decimal"

allow_zero = false
allow_negative = false

# ============================================================
# QUANTITY NORMALIZATION
# ============================================================

[normalization.quantity]

# Bitget V3 USDT/USDC Futures trading and public fills
# use base-asset quantities.
#
# Initial interpretation for standard books:
#
#   raw_unit = base_asset
#
# IMPORTANT:
# Confirm WebSocket depth quantity units with live fixtures
# before activating this specification in production.
#
# The instrument catalog supplies:
#
# quantity_type
# contract_value
# contract_value_asset
#
# Do not multiply base-denominated quantities by an
# unrelated contract multiplier.

raw_unit = "base_asset"

quantity_semantics = "instrument_metadata"

representation = "exact_decimal"

allow_zero = true
allow_negative = false

# Incremental updates replace level quantities.

update_mode = "absolute"

# Quantity zero removes a price level.

zero_quantity_action = "delete"

# ============================================================
# INSTRUMENT RESOLUTION
# ============================================================

[instrument]
source = "envelope.instrument"

resolver = "marketforge_instrument_catalog"

exchange = "bitget"
market = "linear"

require_known_instrument = true
validate_subscription_symbol = true

native_category_source = "envelope.instrument_type"
validate_native_category = true

# Both USDT-FUTURES and USDC-FUTURES are classified
# as Linear by MarketForge.
#
# Resolve native category and normalization context
# before source-stream activation.
#
# No per-event PostgreSQL queries.

# ============================================================
# NATIVE SEQUENCING
# ============================================================

[sequence]
strategy = "bitget_v3_books"

sequence_field = "sequence_id"
previous_sequence_field = "previous_sequence_id"

preserve_sequence_id = true
preserve_previous_sequence_id = true

# Normal incremental continuity:
#
#   current.pseq == previous.seq

continuity_strategy = "previous_sequence_matches"

# seq is not required to increment by exactly one.

require_consecutive_integer_ids = false

# ============================================================
# SNAPSHOT BRIDGE
# ============================================================

[sequence.snapshot_bridge]

enabled = true

# First incremental update after a snapshot:
#
#   update.pseq <= snapshot.seq <= update.seq

strategy = "snapshot_sequence_in_update_range"

on_bridge_failure = "invalidate_and_resynchronize"

# ============================================================
# SEQUENCE RESET
# ============================================================

[sequence.reset]

# Bitget documents pseq=0 during service restarts.
#
# Such transitions may establish a new sequence
# generation and must be handled explicitly.

reset_previous_sequence_id = 0

# Conservative MarketForge policy:
# require an authoritative new snapshot.

action = "require_new_snapshot"

allow_initial_snapshot = true

# ============================================================
# MAINTENANCE EXCEPTION
# ============================================================

[sequence.maintenance]

# Bitget permits exceptional sequence behavior
# during instrument maintenance.
#
# Do not infer packet loss solely from decreasing seq.

allow_sequence_decrease = true

# Continuity must still satisfy the protocol strategy.

require_previous_sequence_match = true

# ============================================================
# SNAPSHOT / DELTA SYNCHRONIZATION
# ============================================================

[synchronization]
strategy = "bitget_v3_books"

snapshot_source = "websocket"

snapshot_action = "snapshot"
delta_action = "update"

require_initial_snapshot = true

# Every authoritative snapshot replaces the book.

snapshot_book_action = "replace"

# Deltas cannot initialize an uninitialized book.

delta_before_snapshot_action = "reject_and_resynchronize"

initial_sequence_strategy = "snapshot_bridge"

# ============================================================
# BOOK STATE
# ============================================================

[book]
storage = "marketforge_book_store"

snapshot_action = "replace"
delta_update_type = "absolute"

zero_quantity_action = "delete"

# Every WebSocket message is applied as one logical
# atomic L2 update.

atomic_message_updates = true

require_valid_generation = true

# ============================================================
# BOOK DEPTH
# ============================================================

[book.depth]

# maxDepth describes the maximum depth for the
# instrument and may vary between trading pairs.

source = "max_depth"
strategy = "exchange_reported"

maximum_documented_depth = 1000

# Validity is relative to exchange-provided coverage.

# ============================================================
# INTEGRITY VALIDATION
# ============================================================

[integrity]
reject_malformed_json = true
reject_missing_required_fields = true

reject_invalid_numeric_values = true
reject_nonpositive_price = true
reject_negative_quantity = true

detect_sequence_gaps = true
detect_stale_updates = true

validate_previous_sequence_id = true
validate_snapshot_bridge = true

allow_documented_sequence_exceptions = true

# Checksum fields were removed on 2026-05-19.

checksum_strategy = "none"

gap_action = "invalidate_and_resynchronize"

# ============================================================
# RECOVERY
# ============================================================

[recovery]
strategy = "bitget_v3_snapshot_recovery"

on_connection_loss = "invalidate_and_resubscribe"

on_sequence_violation = "resubscribe"

on_new_snapshot = "replace_book"

# REST snapshots do not expose a verified matching
# seq/pseq synchronization boundary.
#
# Do not join arbitrary REST snapshots to WebSocket
# deltas without a verified procedure.

rest_snapshot_fallback = false

require_generation_fencing = true

# A fresh snapshot restores current book validity,
# not complete historical L2 coverage.

# ============================================================
# CANONICAL OUTPUT
# ============================================================

[output]
snapshot_event_type = "l2_snapshot"
delta_event_type = "l2_update"

preserve_native_sequence_id = true
preserve_previous_sequence_id = true

preserve_event_timestamp = true
preserve_message_timestamp = true

preserve_source_provenance = true

atomic_updates = true

# MarketForge Live envelope supplies:
#
# stream_id
# stream_cursor
# connection_generation
# subscription_generation
# book_generation
# received_timestamp_ns