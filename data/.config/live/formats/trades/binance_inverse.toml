# MarketForge Live — Binance COIN-M Individual Trades
#
# Exchange: Binance
# Market: Inverse (COIN-M)
# Channel: <symbol>@trade
#
# Connection and recovery configuration:
# exchanges/binance_inverse.toml
#
# Instrument specifications are supplied by the existing
# Python-managed MarketForge instrument catalog.
#
# Each message represents an individual market execution.
#
# IMPORTANT:
# COIN-M trade quantities are denominated in contracts.
# Contract conversion uses authoritative instrument metadata.

schema_version = 1

[format]
id = "binance_inverse"
exchange = "binance"
market = "inverse"
channel = "trades"

encoding = "json"
target_schema = "canonical_trade"

# ============================================================
# MESSAGE IDENTIFICATION
# ============================================================

[message]
root = "$"

event_type_field = "e"
event_type_value = "trade"

symbol_field = "s"
records = "single"

# ============================================================
# FIELD EXTRACTION
# ============================================================

[fields]
trade_id = "t"

price = "p"
quantity = "q"

trade_timestamp = "T"
exchange_event_timestamp = "E"

buyer_is_maker = "m"

# Additional native execution metadata observed in the
# live COIN-M individual trade stream.
trade_type = "X"
symbol_type = "st"

# ============================================================
# FIELD TYPES
# ============================================================

[types]
trade_id = "u64"

price = "decimal_string"
quantity = "decimal_string"

trade_timestamp = "i64"
exchange_event_timestamp = "i64"

buyer_is_maker = "boolean"

trade_type = "optional_string"
symbol_type = "optional_u8"

# ============================================================
# TIMESTAMP NORMALIZATION
# ============================================================

[timestamps]
event_source = "trade_timestamp"

source_unit = "milliseconds"
canonical_unit = "nanoseconds"

preserve_exchange_event_timestamp = true

# ============================================================
# PRICE NORMALIZATION
# ============================================================

[normalization.price]
source = "price"

representation = "exact_decimal"

allow_zero = false
allow_negative = false

# ============================================================
# QUANTITY NORMALIZATION
# ============================================================

[normalization.quantity]
source = "quantity"

# COIN-M individual trade quantity is denominated
# in contracts, not directly in base-asset units.
raw_unit = "contracts"

representation = "exact_decimal"

allow_zero = false
allow_negative = false

# Resolve contract specifications using the instrument
# metadata supplied by Python orchestration.
#
# Required normalization metadata:
#
# quantity_type = contracts
# contract_value
# contract_value_asset
#
# Example BTCUSD_PERP:
#
# contract_value = 100
# contract_value_asset = USD
#
# Native quantity:
#   q = 4 contracts
#
# Canonical quantities:
#   quantity_contracts = 4
#   quantity_quote = 400 USD
#   quantity_base = 400 / execution_price BTC
#
# No contract-specific constants are stored here.

quantity_semantics = "instrument_metadata"

derive_base_quantity = true
derive_quote_quantity = true

# ============================================================
# AGGRESSOR SIDE
# ============================================================

[normalization.side]
source = "buyer_is_maker"

# m=true: buyer was maker -> sell aggressor.
# m=false: seller was maker -> buy aggressor.

true = "sell"
false = "buy"

# ============================================================
# INSTRUMENT RESOLUTION
# ============================================================

[instrument]
source = "symbol"

resolver = "marketforge_instrument_catalog"

exchange = "binance"
market = "inverse"

require_known_instrument = true

# Contract denomination and multiplier are resolved
# once during stream initialization.
#
# No PostgreSQL lookups occur per trade.

# ============================================================
# NATIVE TRADE IDENTITY
# ============================================================

[identity]
strategy = "native_trade_id"

source = "trade_id"

preserve_native_id = true

deduplication_key = [
    "exchange",
    "market",
    "instrument",
    "trade_id",
]

# ============================================================
# INTEGRITY
# ============================================================

[integrity]
reject_malformed_json = true
reject_missing_required_fields = true

reject_invalid_numeric_values = true
reject_nonpositive_price = true
reject_nonpositive_quantity = true

detect_duplicate_trade_ids = true
detect_trade_id_regression = true
detect_trade_id_gaps = true

# Trade-ID gaps trigger a coverage/recovery check.
#
# Do not assume that a numerical gap always proves
# that executions are missing without considering
# the exchange's documented ID semantics.
#
# Recovery must reconcile by native trade identity.
# Reconnecting must not silently reset gap detection.

gap_action = "request_recovery"

# ============================================================
# CANONICAL OUTPUT
# ============================================================

[output]
event_type = "trade"
trade_semantics = "individual"

preserve_native_trade_id = true

preserve_event_timestamp = true
preserve_exchange_event_timestamp = true

preserve_source_provenance = true

# The Live event envelope supplies:
#
# stream_id
# stream_cursor
# connection_generation
# subscription_generation
# received_timestamp_ns