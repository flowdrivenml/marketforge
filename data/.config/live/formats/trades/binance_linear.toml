# MarketForge Live — Binance USDⓈ-M Individual Trades
#
# Exchange: Binance
# Market: Linear (USDⓈ-M)
# Channel: <symbol>@trade
#
# Connection configuration:
# exchanges/binance_linear.toml
#
# Each event represents an individual market execution.
#
# Native quantity semantics are resolved using the
# Python-managed MarketForge instrument catalog.
#
# No instrument-specific contract constants are
# hardcoded in this format.

schema_version = 1

[format]
id = "binance_linear"
exchange = "binance"
market = "linear"
channel = "trades"

encoding = "json"
target_schema = "canonical_trade"

# ============================================================
# MESSAGE IDENTIFICATION
# ============================================================

[message]
root = "$"

event_type_field = "e"
event_type_value = "trade"

symbol_field = "s"
records = "single"

# ============================================================
# FIELD EXTRACTION
# ============================================================

[fields]
trade_id = "t"

price = "p"
quantity = "q"

trade_timestamp = "T"
exchange_event_timestamp = "E"

buyer_is_maker = "m"

# Additional native metadata observed in the live stream.
trade_type = "X"
symbol_type = "st"

# ============================================================
# FIELD TYPES
# ============================================================

[types]
trade_id = "u64"

price = "decimal_string"
quantity = "decimal_string"

trade_timestamp = "i64"
exchange_event_timestamp = "i64"

buyer_is_maker = "boolean"

trade_type = "optional_string"
symbol_type = "optional_u8"

# ============================================================
# TIMESTAMP NORMALIZATION
# ============================================================

[timestamps]
event_source = "trade_timestamp"

source_unit = "milliseconds"
canonical_unit = "nanoseconds"

preserve_exchange_event_timestamp = true

# ============================================================
# PRICE NORMALIZATION
# ============================================================

[normalization.price]
source = "price"

representation = "exact_decimal"

allow_zero = false
allow_negative = false

# ============================================================
# QUANTITY NORMALIZATION
# ============================================================

[normalization.quantity]
source = "quantity"

# USDⓈ-M trade quantity is interpreted using the
# authoritative instrument metadata.
#
# For BTCUSDT perpetuals, the native q field normally
# represents BTC base-asset quantity.
#
# Example:
#
#   p = 80000
#   q = 0.005
#
# If instrument metadata specifies quantity_type = base:
#
#   quantity_base     = 0.005 BTC
#   quantity_quote    = 400 USDT
#   quantity_contracts = None
#
# Other instruments must use their own verified
# quantity semantics and contract metadata.

quantity_semantics = "instrument_metadata"

representation = "exact_decimal"

allow_zero = false
allow_negative = false

derive_base_quantity = true
derive_quote_quantity = true

# ============================================================
# AGGRESSOR SIDE
# ============================================================

[normalization.side]
source = "buyer_is_maker"

# m=true: buyer was maker -> sell aggressor.
# m=false: seller was maker -> buy aggressor.

true = "sell"
false = "buy"

# ============================================================
# INSTRUMENT RESOLUTION
# ============================================================

[instrument]
source = "symbol"

resolver = "marketforge_instrument_catalog"

exchange = "binance"
market = "linear"

require_known_instrument = true

# Validate instrument identity using the resolved stream
# context rather than assuming a particular symbol.
#
# Contract denomination and size, when applicable,
# are resolved once during stream initialization.

# ============================================================
# NATIVE TRADE IDENTITY
# ============================================================

[identity]
strategy = "native_trade_id"

source = "trade_id"

preserve_native_id = true

deduplication_key = [
    "exchange",
    "market",
    "instrument",
    "trade_id",
]

# ============================================================
# INTEGRITY
# ============================================================

[integrity]
reject_malformed_json = true
reject_missing_required_fields = true

reject_invalid_numeric_values = true
reject_nonpositive_price = true
reject_nonpositive_quantity = true

detect_duplicate_trade_ids = true
detect_trade_id_regression = true
detect_trade_id_gaps = true

# Gaps require reconciliation using individual-trade
# identities and a compatible recovery source.
#
# Do not assume the numerical difference between IDs
# alone proves completeness or missing executions.

gap_action = "request_recovery"

# ============================================================
# SYMBOL TYPE
# ============================================================

[symbol_type]
source = "symbol_type"

# Observed:
# st=1 for USDⓈ-M.
#
# Validate the discriminator when present.

expected_values = [1]

missing_policy = "allow"
mismatch_policy = "reject"

# ============================================================
# CANONICAL OUTPUT
# ============================================================

[output]
event_type = "trade"
trade_semantics = "individual"

preserve_native_trade_id = true

preserve_event_timestamp = true
preserve_exchange_event_timestamp = true

preserve_source_provenance = true

# Live envelope metadata:
#
# stream_id
# stream_cursor
# connection_generation
# subscription_generation
# received_timestamp_ns