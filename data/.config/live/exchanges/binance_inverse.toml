# MarketForge Live — Binance COIN-M Futures (Inverse)
#
# Proposed MarketForge Live exchange-profile schema v1.
#
# Official documentation:
# https://developers.binance.com/en/docs/products/derivatives-trading-coin-futures/websocket-market-streams/Connect
# https://developers.binance.com/en/docs/catalog/core-trading-derivatives-trading-coin-m-futures/api/rest-api/market-data
#
# Scope:
#   WebSocket connectivity
#   Subscription management
#   Channel definitions
#   REST endpoints
#   Rate-limit specifications
#
# Instrument metadata is provided by Python orchestration.
# Trade and depth normalization are defined separately.

schema_version = 1

[exchange]
id = "binance"
market = "inverse"
profile = "binance_inverse" 

# ============================================================
# WEBSOCKET
# ============================================================

[websocket]
base_url = "wss://dstream.binance.com"

raw_path = "/ws"
combined_path = "/stream"

connection_lifetime_seconds = 86400
max_subscriptions_per_connection = 1024

# Includes client control messages and WebSocket control frames.
max_client_messages_per_second = 10

symbol_case = "lowercase"
timestamp_unit = "milliseconds"

# ------------------------------------------------------------
# HEARTBEAT
# ------------------------------------------------------------

[websocket.heartbeat]
strategy = "websocket_control_frames"

server_ping_interval_seconds = 180
pong_deadline_seconds = 600

respond_to_ping = true
echo_ping_payload = true

# ------------------------------------------------------------
# CONNECTION LIFECYCLE
# ------------------------------------------------------------

[websocket.lifecycle]

# MarketForge policy, not an exchange requirement.
rotate_before_expiration_seconds = 300

# ------------------------------------------------------------
# SUBSCRIPTIONS
# ------------------------------------------------------------

[websocket.subscription]
strategy = "json_rpc"

subscribe_method = "SUBSCRIBE"
unsubscribe_method = "UNSUBSCRIBE"
list_method = "LIST_SUBSCRIPTIONS"

request_id_field = "id"
request_id_type = "unsigned_integer"

success_field = "result"
success_is_null = true

supports_dynamic_subscriptions = true
supports_unsubscribe = true
supports_list_subscriptions = true

# ------------------------------------------------------------
# MESSAGE ROUTING
# ------------------------------------------------------------

[websocket.routing]
mode = "combined"

combined_wrapper_field = "data"
combined_stream_field = "stream"

event_type_field = "e"
symbol_field = "s"

# ============================================================
# TRADES
# ============================================================

[channels.trades]
enabled = true

# Binance individual trade WebSocket stream.
stream_template = "{symbol_lower}@trade"

# Internal MarketForge event classification.
event_type = "trades"

format = "trades/binance_inverse"

# Each event represents an individual execution.
trade_semantics = "individual"

# REST-based trade recovery.
recovery_strategy = "trades"
recovery_endpoint = "recent_trades"

# ============================================================
# L2 DIFFERENTIAL DEPTH
# ============================================================

# ============================================================
# L2 DIFFERENTIAL DEPTH
# ============================================================

[channels.depth]
enabled = true

stream_template = "{symbol_lower}@depth"
fast_stream_template = "{symbol_lower}@depth@100ms"

default_interval_ms = 250
supported_intervals_ms = [100, 250, 500]

event_type = "depthUpdate"
format = "depth/binance_inverse"

synchronization_strategy = "binance_futures_diff_depth"
snapshot_endpoint = "depth_snapshot"

first_update_id_field = "U"
last_update_id_field = "u"
previous_update_id_field = "pu"

quantity_mode = "absolute"
zero_quantity_action = "delete"

# Contract quantity normalization uses instrument metadata.

# ============================================================
# REST
# ============================================================

[rest]
base_url = "https://dapi.binance.com"

# MarketForge operational policy.
request_timeout_seconds = 10

# ------------------------------------------------------------
# ORDER BOOK SNAPSHOT
# ------------------------------------------------------------

[rest.endpoints.depth_snapshot]

required_parameters = ["symbol"]
limit_parameter = "limit"
method = "GET"
path = "/dapi/v1/depth"

parameters = ["symbol", "limit"]

default_limit = 500
maximum_limit = 1000

response_sequence_field = "lastUpdateId"

authentication = "none"
weight_policy = "depth_snapshot"

[rest.endpoints.depth_snapshot.application_response]
strategy = "raw"


# ------------------------------------------------------------
# RECENT INDIVIDUAL TRADES
# ------------------------------------------------------------

[rest.endpoints.recent_trades]

required_parameters = ["symbol"]
limit_parameter = "limit"
method = "GET"
path = "/dapi/v1/trades"

parameters = ["symbol", "limit"]

default_limit = 500
maximum_limit = 1000

authentication = "none"
weight_policy = "recent_trades"

[rest.endpoints.recent_trades.application_response]
strategy = "raw"


# ------------------------------------------------------------
# HISTORICAL INDIVIDUAL TRADES
# ------------------------------------------------------------

[rest.endpoints.aggregate_trades]

required_parameters = ["symbol"]
limit_parameter = "limit"
method = "GET"
path = "/dapi/v1/aggTrades"

parameters = [
    "symbol",
    "fromId",
    "startTime",
    "endTime",
    "limit",
]

default_limit = 500
maximum_limit = 1000

pagination_strategy = "aggregate_trade_id"
pagination_parameter = "fromId"

authentication = "none"

# Binance documents only a 48-hour query horizon.
max_history_hours = 48

# When using startTime and endTime together, the requested
# interval must be shorter than one hour.
max_time_window_ms = 3600000

weight_policy = "aggregate_trades"

[rest.endpoints.aggregate_trades.application_response]
strategy = "raw"


# ============================================================
# REST RATE LIMITING
# ============================================================

[rest.rate_limiting]
strategy = "weighted_shared_pool"

# Instrument metadata and exchange rule discovery are
# managed by Python orchestration.

limits_source = "configured"

usage_header_prefix = "X-MBX-USED-WEIGHT"

http_throttled_status = 429
http_banned_status = 418

honor_retry_after = true

# ------------------------------------------------------------
# ORDER BOOK SNAPSHOT WEIGHTS
# ------------------------------------------------------------

[rest.weight_policies.depth_snapshot]
type = "discrete"
parameter = "limit"

tiers = [
    { limit = 5, weight = 2 },
    { limit = 10, weight = 2 },
    { limit = 20, weight = 2 },
    { limit = 50, weight = 2 },
    { limit = 100, weight = 5 },
    { limit = 500, weight = 10 },
    { limit = 1000, weight = 20 },
]

# ------------------------------------------------------------
# OTHER ENDPOINT WEIGHTS
# ------------------------------------------------------------

[rest.weight_policies.recent_trades]
type = "fixed"
weight = 5

[rest.weight_policies.historical_trades]
type = "fixed"
weight = 200

[rest.weight_policies.aggregate_trades]
type = "fixed"
weight = 20

[rest.endpoints.recent_trades.trade_normalization]
request_symbol_parameter = "symbol"
trade_id = "id"
price = "price"
quantity = "qty"
timestamp = "time"
timestamp_unit = "milliseconds"
side = "isBuyerMaker"
side_strategy = "mapped"

[rest.endpoints.recent_trades.trade_normalization.side_mappings]
"true" = "sell"
"false" = "buy"
