# MarketForge Live — OKX Linear
#
# Proposed exchange-profile schema v1.
#
# Official references:
# https://www.okx.com/docs-v5/en/
# https://www.okx.com/docs-v5/log_en/
#
# Exchange: OKX
# Market: Linear
#
# Covers eligible USDT/USDC-margined SWAP and FUTURES.
#
# Instrument specifications are provided by
# Python orchestration and the existing instrument catalog.
#
# Trade and L2 normalization are configured separately.

schema_version = 1

[exchange]
id = "okx"
market = "linear"
profile = "okx_linear"

# ============================================================
# WEBSOCKET
# ============================================================

[websocket]
authentication = "none"

symbol_case = "uppercase"
timestamp_unit = "milliseconds"

# ------------------------------------------------------------
# ROUTES
# ------------------------------------------------------------

[websocket.routes.public]
url = "wss://ws.okx.com/ws/v5/public"
authentication = "none"

[websocket.routes.business]
url = "wss://ws.okx.com/ws/v5/business"
authentication = "none"

# ------------------------------------------------------------
# CONNECTION LIMITS
# ------------------------------------------------------------

[websocket.limits]

connection_attempts_per_second = 3

subscription_operations_per_hour = 480

max_subscription_payload_bytes = 65536

# ------------------------------------------------------------
# HEARTBEAT
# ------------------------------------------------------------

[websocket.heartbeat]

strategy = "text_ping_pong"

request = "ping"
response = "pong"

# MarketForge policy: send before OKX inactivity timeout.
inactivity_seconds = 25
response_timeout_seconds = 5

reset_timer_on_message = true

# ------------------------------------------------------------
# SUBSCRIPTIONS
# ------------------------------------------------------------

[websocket.subscription]

strategy = "json_operation"

subscribe_method = "subscribe"
unsubscribe_method = "unsubscribe"

operation_field = "op"
arguments_field = "args"

request_id_field = "id"
request_id_type = "string"
request_id_optional = true

acknowledgement_field = "event"

subscribe_acknowledgement = "subscribe"
unsubscribe_acknowledgement = "unsubscribe"

error_event = "error"
error_code_field = "code"
error_message_field = "msg"

supports_dynamic_subscriptions = true
supports_unsubscribe = true

# ------------------------------------------------------------
# MESSAGE ROUTING
# ------------------------------------------------------------

[websocket.routing]

mode = "arg"

channel_field = "arg.channel"
instrument_field = "arg.instId"

payload_field = "data"
action_field = "action"

# ============================================================
# INDIVIDUAL TRADES
# ============================================================

[channels.trades]
enabled = true

route = "business"

channel = "trades-all"

subscription_template = '{"channel":"trades-all","instId":"{symbol}"}'

format = "trades/okx_linear"

trade_semantics = "individual"

records = "array"
payload_path = "data"

recovery_strategy = "historical_trade_reconciliation"
recovery_endpoint = "historical_trades"

# ============================================================
# AGGREGATED TRADES
# ============================================================

[channels.aggregate_trades]
enabled = false

route = "public"

channel = "trades"

subscription_template = '{"channel":"trades","instId":"{symbol}"}'

# Requires a separate aggregated-trade format.
format = "trades/okx_linear_aggregated"

trade_semantics = "aggregated"

records = "array"
payload_path = "data"

recovery_strategy = "coverage_evaluation"

# ============================================================
# L2 ORDER BOOK
# ============================================================

[channels.depth]
enabled = true

route = "public"

channel = "books"

subscription_template = '{"channel":"books","instId":"{symbol}"}'

format = "depth/okx_linear"

depth = 400
push_interval_ms = 100

synchronization_strategy = "okx_v5_books"

snapshot_source = "websocket"
snapshot_action = "replace"

sequence_field = "seqId"
previous_sequence_field = "prevSeqId"

# OKX deprecated standard book checksums in 2026.
checksum_strategy = "none"

quantity_mode = "absolute"
zero_quantity_action = "delete"

# ------------------------------------------------------------
# DEPTH QUANTITY SEMANTICS
# ------------------------------------------------------------

[channels.depth.quantity]

# Linear derivative depth quantities depend on
# contract specifications supplied by orchestration.

quantity_semantics = "instrument_metadata"

# ============================================================
# OPTIONAL SNAPSHOT-ONLY CHANNELS
# ============================================================

[channels.depth5]
enabled = false

route = "public"

channel = "books5"

subscription_template = '{"channel":"books5","instId":"{symbol}"}'

depth = 5
push_interval_ms = 100

synchronization_strategy = "snapshot_only"

[channels.bbo]
enabled = false

route = "public"

channel = "bbo-tbt"

subscription_template = '{"channel":"bbo-tbt","instId":"{symbol}"}'

depth = 1
push_interval_ms = 10

synchronization_strategy = "snapshot_only"

# ============================================================
# REST API
# ============================================================

[rest]

base_url = "https://www.okx.com"

authentication = "none"

# MarketForge operational policy.
request_timeout_seconds = 10

# ------------------------------------------------------------
# ORDER BOOK SNAPSHOT
# ------------------------------------------------------------

[rest.endpoints.depth_snapshot]

required_parameters = ["instId"]
limit_parameter = "sz"

method = "GET"
path = "/api/v5/market/books"

parameters = [
    "instId",
    "sz",
]

default_limit = 400
maximum_limit = 400

response_root = "data"
response_record_container = "single_object_array"
response_sequence_field = "seqId"

authentication = "none"

rate_limit_policy = "depth_snapshot"

[rest.endpoints.depth_snapshot.application_response]
strategy = "envelope"
code_field = "code"
success_codes = ["0"]
message_field = "msg"
data_field = "data"


# ------------------------------------------------------------
# RECENT TRADES
# ------------------------------------------------------------

[rest.endpoints.recent_trades]

required_parameters = ["instId"]
limit_parameter = "limit"

method = "GET"
path = "/api/v5/market/trades"

parameters = [
    "instId",
    "limit",
]

default_limit = 100
maximum_limit = 500

response_root = "data"

authentication = "none"

rate_limit_policy = "recent_trades"

[rest.endpoints.recent_trades.application_response]
strategy = "envelope"
code_field = "code"
success_codes = ["0"]
message_field = "msg"
data_field = "data"


# ------------------------------------------------------------
# HISTORICAL TRADES
# ------------------------------------------------------------

[rest.endpoints.historical_trades]

required_parameters = ["instId"]
limit_parameter = "limit"

method = "GET"
path = "/api/v5/market/history-trades"

parameters = [
    "instId",
    "type",
    "after",
    "before",
    "limit",
]

default_limit = 100
maximum_limit = 100

response_root = "data"

authentication = "none"

max_history_days = 90

# type=1: trade-ID pagination
# type=2: timestamp pagination
#
# after: older records
# before: newer trade IDs; not timestamp pagination

pagination_strategy = "okx_trade_history"
default_pagination_type = 1

rate_limit_policy = "historical_trades"

[rest.endpoints.historical_trades.application_response]
strategy = "envelope"
code_field = "code"
success_codes = ["0"]
message_field = "msg"
data_field = "data"


# ============================================================
# RATE LIMITING
# ============================================================

[rest.rate_limiting]

strategy = "endpoint_window"

rule = "ip"

rate_limit_error_code = "50011"

# ------------------------------------------------------------
# ENDPOINT POLICIES
# ------------------------------------------------------------

[rest.rate_limit_policies.depth_snapshot]
max_requests = 40
window_seconds = 2

[rest.rate_limit_policies.recent_trades]
max_requests = 100
window_seconds = 2

[rest.rate_limit_policies.historical_trades]
max_requests = 20
window_seconds = 2

[rest.endpoints.recent_trades.trade_normalization]
request_symbol_parameter = "instId"
trade_id = "tradeId"
price = "px"
quantity = "sz"
timestamp = "ts"
timestamp_unit = "milliseconds"
side = "side"
symbol = "instId"
side_strategy = "mapped"

[rest.endpoints.recent_trades.trade_normalization.side_mappings]
"buy" = "buy"
"sell" = "sell"
