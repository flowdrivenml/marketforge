name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/.config/workflows/data_engineering/pipeline/bybit_quickstart.toml'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'CITATION.cff'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build Zensical
        working-directory: docs
        run: zensical build --strict
      - name: Verify links and recipe
        run: python docs/check_links.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
