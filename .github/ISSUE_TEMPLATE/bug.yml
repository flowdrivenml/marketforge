name: Bug report
description: Report a reproducible problem with MarketForge.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: For suspected vulnerabilities, use the repository's private reporting option under Security. Remove secrets and private data from logs and examples.
  - type: input
    id: environment
    attributes:
      label: MarketForge version and platform
      placeholder: Release tag or commit, OS, and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or screen, relevant settings, and a minimal input when practical.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or run evidence
      description: Share a short redacted excerpt and the stage that reported the error.
